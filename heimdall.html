<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heimdall</title>
<style>
/* ============ Heimdall — светлая тема по умолчанию + тёмная по data-theme ============ */
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --bg-elev: #fbfcfd;
  --bg-hover: #eef1f5;
  --bg-active: #e7edf5;
  --border: #e3e7ec;
  --border-strong: #cbd2da;
  --text: #1c2430;
  --muted: #6b7683;
  --faint: #9aa4b0;
  --accent: #e2a33b;
  --accent-text: #9a5f06;
  --accent-hover: #cf9029;
  --accent-bg: rgba(226, 163, 59, 0.14);
  --on-accent: #3a2708;
  --green: #1f9d55;
  --green-bg: rgba(31, 157, 85, 0.12);
  --yellow: #b7791f;
  --yellow-bg: rgba(183, 121, 31, 0.12);
  --red: #c0392b;
  --red-bg: rgba(192, 57, 43, 0.10);
  --cyan: #0e7490;
  --blue: #2f6feb;
  --purple: #7c3aed;
  --shadow: rgba(20, 30, 50, 0.14);
  --scrollbar-thumb: #cbd2da;
  --row-hover: rgba(20, 30, 50, 0.05);
  --accent-drag: rgba(226, 163, 59, 0.30);
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
  --accent-deep: #b97a1e;
  --chart-1: #b5791f;
  --chart-2: #0e7490;
  --chart-3: #2f6feb;
  --chart-4: #7c3aed;
  --chart-5: #1f9d55;
  --chart-6: #a3860f;
  --chart-7: #c0392b;
  --chart-8: #6b7683;
  --sidebar-w: 300px;
  --bottom-h: 300px;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #22262c;
  --bg-panel: #282d34;
  --bg-elev: #2e343c;
  --bg-hover: #333a43;
  --bg-active: #3a424c;
  --border: #363d47;
  --border-strong: #454e5a;
  --text: #d6dde6;
  --muted: #93a0b0;
  --faint: #6b7686;
  --accent: #e2a33b;
  --accent-text: #f0bb5e;
  --accent-hover: #eeb452;
  --accent-bg: rgba(226, 163, 59, 0.14);
  --on-accent: #14181e;
  --green: #4fc08a;
  --green-bg: rgba(79, 192, 138, 0.13);
  --yellow: #e0c45c;
  --yellow-bg: rgba(224, 196, 92, 0.12);
  --red: #e26a5a;
  --red-bg: rgba(226, 106, 90, 0.12);
  --cyan: #56b6c2;
  --blue: #6f9ee8;
  --purple: #b08ae0;
  --shadow: rgba(0, 0, 0, 0.4);
  --scrollbar-thumb: #454e5a;
  --row-hover: rgba(255, 255, 255, 0.05);
  --accent-drag: rgba(226, 163, 59, 0.30);
  --accent-deep: #b97a1e;
  --chart-1: #e2a33b;
  --chart-2: #56b6c2;
  --chart-3: #6f9ee8;
  --chart-4: #b08ae0;
  --chart-5: #4fc08a;
  --chart-6: #e0c45c;
  --chart-7: #e26a5a;
  --chart-8: #8a94a3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
}
::selection { background: rgba(226, 163, 59, 0.3); }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 5px; border: 2px solid var(--bg-panel); }
*::-webkit-scrollbar-track { background: transparent; }

code, .mono { font-family: var(--mono); font-size: 12px; }

/* ============ Каркас ============ */
.app { height: 100vh; display: flex; flex-direction: column; }

.titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px; height: 38px; flex: none;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
}
.titlebar .logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 650; font-size: 13px; letter-spacing: 0.2px;
}
.logo-mark {
  width: 18px; height: 18px; border-radius: 4px; flex: none;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
  display: grid; place-items: center;
  color: var(--on-accent); font-family: var(--mono); font-size: 11px; font-weight: 700;
}
.titlebar .spacer { flex: 1; }

.main { flex: 1; display: flex; min-height: 0; }

/* ============ Сайдбар ============ */
.sidebar {
  width: var(--sidebar-w); min-width: 0; flex: none;
  background: var(--bg-panel);
  display: flex; flex-direction: column; min-height: 0;
}
.sidebar.collapsed { display: none; }
.sidebar.collapsed + .resizer-v { display: none; }
.sidebar-head { padding: 8px 10px 6px; display: flex; flex-direction: column; gap: 6px; }
.sidebar-title {
  font-size: 11px; font-weight: 650; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  display: flex; align-items: center; justify-content: space-between;
}
.tree { flex: 1; overflow: auto; padding: 2px 6px 12px; }

.tree-schema-label {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 4px 3px; cursor: pointer; user-select: none;
  color: var(--muted); font-family: var(--mono); font-size: 11.5px;
}
.tree-schema-label:hover { color: var(--text); }
.tree-caret { width: 10px; flex: none; font-size: 9px; color: var(--faint); transition: transform 0.12s; display: inline-block; }
.tree-caret.open { transform: rotate(90deg); }

.tree-model {
  border-radius: var(--radius); margin: 1px 0;
}
.tree-model-row {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 6px 4px 16px; cursor: pointer; border-radius: var(--radius);
  user-select: none;
}
.tree-model-row:hover { background: var(--bg-hover); }
.tree-model.selected > .tree-model-row { background: var(--bg-active); }
.tree-model.selected > .tree-model-row .tree-model-name { color: var(--accent-text); }
.tree-model-name { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-model-desc { padding: 0 6px 4px 32px; color: var(--faint); font-size: 11px; line-height: 1.3; }

.tree-children { padding: 1px 0 5px 24px; display: flex; flex-direction: column; gap: 0; }
.tree-leaf {
  display: flex; align-items: center; gap: 6px;
  padding: 2px 6px; border-radius: 4px; min-width: 0;
}
.tree-leaf:hover { background: var(--bg-hover); }
.tree-leaf .leaf-name { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-leaf .leaf-extra { color: var(--faint); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
.tree-leaf.param { opacity: 0.5; }
.tree-section-label { padding: 4px 6px 1px; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; }
.tree-empty { padding: 20px 10px; color: var(--faint); text-align: center; }

/* иконки типов */
.ticon {
  width: 15px; height: 15px; flex: none; border-radius: 3px;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 600;
  background: var(--bg-elev); color: var(--muted); border: 1px solid var(--border);
}
.ticon.t-num { color: var(--cyan); }
.ticon.t-date { color: var(--accent-text); }
.ticon.t-arr { color: var(--purple); }
.ticon.t-uuid { color: var(--blue); }
.ticon.t-bool { color: var(--green); }
.ticon.t-metric { color: var(--green); background: var(--green-bg); border-color: transparent; }
.ticon.t-virtual { color: var(--purple); }

/* ============ Ресайзеры ============ */
.resizer-v { width: 5px; flex: none; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background 0.1s; }
.resizer-v:hover, .resizer-v.dragging { background: var(--accent-drag); }
.resizer-h { height: 5px; flex: none; cursor: row-resize; background: transparent; border-top: 1px solid var(--border); transition: background 0.1s; }
.resizer-h:hover, .resizer-h.dragging { background: var(--accent-drag); }

/* ============ Центр ============ */
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ws-tabs {
  display: flex; align-items: stretch; gap: 2px; flex: none;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
  padding: 0 8px;
}
.ws-tab {
  display: flex; align-items: center; gap: 7px;
  padding: 0 14px; height: 36px; cursor: pointer; user-select: none;
  color: var(--muted); font-size: 12.5px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.ws-tab:hover { color: var(--text); }
.ws-tab.active { color: var(--accent-text); border-bottom-color: var(--accent); }
.ws-tab .ws-tab-icon { font-size: 13px; opacity: 0.8; }

.workspace { flex: 1; min-height: 0; position: relative; display: flex; }
.ws-page { display: none; flex: 1; min-width: 0; min-height: 0; }
.ws-page.active { display: flex; }

.page-scroll { flex: 1; overflow: auto; padding: 18px 22px 30px; }
.page-placeholder {
  flex: 1; display: grid; place-items: center; color: var(--faint);
}
.page-placeholder .ph-inner { text-align: center; max-width: 360px; }
.page-placeholder .ph-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }

/* ============ Нижняя панель ============ */
.bottom-panel {
  height: var(--bottom-h); flex: none; min-height: 0;
  background: var(--bg-panel);
  display: flex; flex-direction: column;
}
.bottom-panel.collapsed { height: 33px !important; }
.bottom-panel.collapsed .bp-body { display: none; }
.bp-tabs {
  display: flex; align-items: center; gap: 2px; flex: none;
  padding: 0 8px; height: 33px; border-bottom: 1px solid var(--border);
}
.bp-tab {
  padding: 0 11px; height: 33px; display: flex; align-items: center; gap: 6px;
  cursor: pointer; color: var(--muted); font-size: 12px; user-select: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.bp-tab:hover { color: var(--text); }
.bp-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.bp-tab .bp-dot { width: 6px; height: 6px; border-radius: 50%; }
.bp-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
.bp-pad { padding: 12px 14px; }
.bp-meta {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  color: var(--muted); font-size: 11.5px;
  position: sticky; top: 0; background: var(--bg-panel); z-index: 3;
}
.bp-empty { padding: 30px; text-align: center; color: var(--faint); }

/* ============ Статус-бар ============ */
.statusbar {
  height: 26px; flex: none; display: flex; align-items: center; gap: 14px;
  padding: 0 12px; background: var(--bg-panel); border-top: 1px solid var(--border);
  color: var(--muted); font-size: 11.5px;
}
.statusbar .sb-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.statusbar .sb-spacer { flex: 1; }
.sb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sb-dot.ok { background: var(--green); box-shadow: 0 0 5px color-mix(in srgb, var(--green) 70%, transparent); }
.sb-dot.bad { background: var(--red); }
.sb-dot.wait { background: var(--yellow); }

/* ============ Базовые контролы ============ */
button, .btn {
  font-family: var(--sans); font-size: 12.5px; color: var(--text);
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 5px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}
button:hover, .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600;
}
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button.small, .btn.small { padding: 2px 8px; font-size: 11.5px; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); background: var(--bg-hover); }
button.danger-ghost { background: transparent; border-color: transparent; color: var(--faint); }
button.danger-ghost:hover { color: var(--red); background: var(--red-bg); }
button.iconbtn { padding: 4px 7px; }

input[type="text"], input[type="number"], input[type="date"], input[type="password"], select, textarea {
  font-family: var(--sans); font-size: 12.5px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 5px 8px; outline: none;
  min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--faint); }
input.mono, textarea.mono, select.mono { font-family: var(--mono); font-size: 12px; }
input[type="date"] { color-scheme: inherit; }
select { cursor: pointer; }
label.checkline { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); cursor: pointer; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > .field-label { font-size: 11px; color: var(--muted); font-weight: 550; letter-spacing: 0.3px; }
.field > .field-hint { font-size: 10.5px; color: var(--faint); }
.field.invalid > input, .field.invalid > select { border-color: var(--red); }
.field-error { font-size: 11px; color: var(--red); }

.searchbox { position: relative; }
.searchbox input { width: 100%; padding-left: 26px; }
.searchbox::before {
  content: "⌕"; position: absolute; left: 8px; top: 50%; transform: translateY(-54%);
  color: var(--faint); font-size: 14px; pointer-events: none;
}

/* segmented */
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 2px; gap: 2px; }
.seg button { border: none; background: transparent; padding: 3px 10px; border-radius: 4px; color: var(--muted); font-size: 12px; }
.seg button:hover { background: var(--bg-hover); }
.seg button.on { background: var(--bg-active); color: var(--text); }
.seg button.on.seg-accent { background: var(--accent-bg); color: var(--accent-text); }

/* ============ Бейджи и чипсы ============ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px;
  padding: 1px 7px; border-radius: 20px;
  background: var(--bg-elev); color: var(--muted); border: 1px solid var(--border-strong);
  white-space: nowrap;
}
.badge.mono { font-family: var(--mono); }
.badge.b-history { color: var(--accent-text); background: var(--accent-bg); border-color: transparent; }
.badge.b-array { color: var(--purple); background: rgba(176,138,224,0.12); border-color: transparent; }
.badge.b-joins { color: var(--blue); background: rgba(111,158,232,0.12); border-color: transparent; }
.badge.b-plain { color: var(--muted); }
.badge.b-green { color: var(--green); background: var(--green-bg); border-color: transparent; }
.badge.b-yellow { color: var(--yellow); background: var(--yellow-bg); border-color: transparent; }
.badge.b-red { color: var(--red); background: var(--red-bg); border-color: transparent; }
.badge.b-cyan { color: var(--cyan); background: rgba(86,182,194,0.12); border-color: transparent; }
.badge.b-dim { opacity: 0.55; }

.minibadge {
  display: inline-block; font-size: 9.5px; font-weight: 650; padding: 0 5px;
  border-radius: 3px; line-height: 15px; vertical-align: 1px;
  background: var(--bg-elev); color: var(--muted); border: 1px solid var(--border);
  font-family: var(--mono); letter-spacing: 0.3px;
}
.minibadge.m-virtual { color: var(--purple); border-color: rgba(176,138,224,0.4); }
.minibadge.m-time { color: var(--accent-text); border-color: rgba(226,163,59,0.4); }
.minibadge.m-param { color: var(--faint); }
.minibadge.m-k1 { color: var(--green); } .minibadge.m-k2 { color: var(--yellow); } .minibadge.m-k3 { color: var(--red); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--bg-active); border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 2px 5px 2px 9px;
  font-family: var(--mono); font-size: 11.5px; user-select: none;
}
.chip .chip-x {
  width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center;
  cursor: pointer; color: var(--faint); font-size: 12px; line-height: 1;
}
.chip .chip-x:hover { background: var(--red-bg); color: var(--red); }
.chip.c-metric { border-color: rgba(79,192,138,0.45); color: var(--green); }
.chip.c-param { border-style: dashed; opacity: 0.75; }
.chip.c-warn { border-color: rgba(224,196,92,0.6); }
.chip.static { padding: 2px 9px; }

.gran-chip {
  display: inline-block; font-family: var(--mono); font-size: 10.5px;
  border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 6px;
  color: var(--muted); background: var(--bg);
}
.gran-chip.on { color: var(--accent-text); border-color: rgba(226,163,59,0.5); background: var(--accent-bg); }

/* ============ Таблицы ============ */
table.dt { border-collapse: collapse; width: 100%; font-size: 12px; }
table.dt th {
  text-align: left; font-weight: 600; font-size: 11px; color: var(--muted);
  padding: 6px 10px; border-bottom: 1px solid var(--border-strong);
  position: sticky; top: 0; background: var(--bg-panel); z-index: 2;
  white-space: nowrap;
}
table.dt td { padding: 4px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.dt tr:hover td { background: var(--row-hover); }
table.dt td.num, table.dt th.num { text-align: right; font-family: var(--mono); }
table.dt td.mono { font-family: var(--mono); font-size: 11.5px; }
td .null { color: var(--faint); font-style: italic; }

/* карточные таблицы обзорщика */
table.spec { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.spec th {
  text-align: left; font-weight: 600; font-size: 10.5px; color: var(--faint);
  text-transform: uppercase; letter-spacing: 0.6px;
  padding: 5px 10px; border-bottom: 1px solid var(--border-strong);
}
table.spec td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.spec tr:last-child td { border-bottom: none; }
table.spec tr.param-row td { opacity: 0.55; }

/* ============ Карточки / секции ============ */
.card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
}
.card + .card { margin-top: 14px; }
.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
}
.card-head .card-title { font-weight: 650; font-size: 12.5px; }
.card-head .card-sub { color: var(--faint); font-size: 11.5px; }
.card-body { padding: 0; }
.card-body.padded { padding: 12px 14px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ============ Код и подсветка ============ */
pre.code {
  margin: 0; padding: 12px 14px; overflow: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  background: var(--bg); border-radius: var(--radius);
  tab-size: 4; white-space: pre;
}
pre.code.framed { border: 1px solid var(--border); }
.tok-kw { color: var(--accent-text); font-weight: 600; }
.tok-str { color: var(--green); }
.tok-num { color: var(--cyan); }
.tok-com { color: var(--faint); font-style: italic; }
.tok-fn { color: var(--blue); }
.tok-type { color: var(--purple); }
.tok-key { color: var(--blue); }
.tok-punct { color: var(--muted); }

/* ============ Конструктор ============ */
.builder-grid { display: flex; flex-direction: column; gap: 14px; max-width: 1060px; }
.mode-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 9px 14px; border-radius: 8px;
  background: var(--bg-panel); border: 1px solid var(--border);
}
.mode-pill {
  font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 1px;
  padding: 3px 12px; border-radius: 20px;
}
.mode-pill.m-rows { color: var(--blue); background: rgba(111,158,232,0.14); }
.mode-pill.m-aggregate { color: var(--green); background: var(--green-bg); }
.mode-pill.m-history { color: var(--accent-text); background: var(--accent-bg); }
.mode-explain { color: var(--muted); font-size: 12px; flex: 1; min-width: 200px; }
.preflight { display: flex; flex-direction: column; gap: 5px; }
.preflight-item {
  display: flex; align-items: baseline; gap: 8px; font-size: 12px;
  padding: 5px 10px; border-radius: var(--radius);
}
.preflight-item.warn { color: var(--yellow); background: var(--yellow-bg); }
.preflight-item.err { color: var(--red); background: var(--red-bg); }

.picker-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .picker-cols { grid-template-columns: 1fr; } }
.picker { display: flex; flex-direction: column; }
.picker .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 12px; min-height: 38px; }
.picker .chips:empty::after { content: attr(data-empty); color: var(--faint); font-size: 11.5px; font-family: var(--sans); }
.picker-search { padding: 0 12px 8px; }
.picker-list { max-height: 180px; overflow: auto; border-top: 1px solid var(--border); }
.picker-item {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px;
  cursor: pointer; user-select: none; min-width: 0;
}
.picker-item:hover { background: var(--bg-hover); }
.picker-item.selected { color: var(--accent-text); }
.picker-item.param { opacity: 0.55; }
.picker-item .pi-name { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.picker-item .pi-desc { color: var(--faint); font-size: 11px; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-item .pi-check { width: 14px; color: var(--accent); flex: none; font-size: 11px; }

.warn-inline {
  margin: 0 12px 10px; padding: 6px 10px; border-radius: var(--radius);
  background: var(--yellow-bg); color: var(--yellow); font-size: 11.5px;
}

/* временное измерение */
.td-grid { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; padding: 12px 14px; }
.td-grid .field { min-width: 130px; }

/* ---- дерево фильтров ---- */
.fgroup { border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg); }
.fgroup.f-and { border-left: 3px solid var(--blue); }
.fgroup.f-or { border-left: 3px solid var(--purple); }
.fgroup.f-not { border-left: 3px solid var(--red); }
.fgroup-head {
  display: flex; align-items: center; gap: 8px; padding: 6px 9px;
}
.fgroup-body { display: flex; flex-direction: column; gap: 7px; padding: 0 9px 9px 9px; }
.fgroup-body .fgroup, .fgroup-body .fcond { margin-left: 10px; }
.fjoin-label { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-left: 10px; user-select: none; }
.fcond {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 5px 7px;
}
.fcond select, .fcond input { font-size: 12px; padding: 3px 7px; }
.fcond select.f-col { font-family: var(--mono); max-width: 200px; }
.fcond select.f-op { font-family: var(--mono); }
.filters-empty { color: var(--faint); font-size: 12px; padding: 2px 10px 4px; }

/* тег-инпут */
.taginput {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 2px 5px; min-width: 180px; max-width: 380px;
}
.taginput:focus-within { border-color: var(--accent); }
.taginput input { border: none; background: transparent; flex: 1; min-width: 60px; padding: 3px 3px; }
.taginput .chip { font-size: 11px; padding: 0 3px 0 7px; }

/* сортировка и лимиты */
.sort-rows { display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; }
.sort-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.limits-grid { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; padding: 12px 14px; }
.actions-bar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

/* ============ График ============ */
.chart-wrap { padding: 8px 14px 14px; }
.chart-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 14px 0; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 14px 0; font-size: 11.5px; color: var(--muted); }
.chart-legend .lg-item { display: flex; align-items: center; gap: 5px; }
.lg-swatch { width: 14px; height: 3px; border-radius: 2px; }
svg.linechart text { font-family: var(--mono); font-size: 10px; fill: var(--faint); }
svg.linechart .gridline { stroke: var(--border); stroke-width: 1; }
svg.linechart .axis { stroke: var(--border-strong); stroke-width: 1; }
.chart-tip {
  position: fixed; z-index: 90; pointer-events: none;
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 6px 9px; font-size: 11px;
  box-shadow: 0 6px 20px var(--shadow); display: none; max-width: 260px;
}
.chart-tip .tip-date { font-family: var(--mono); color: var(--muted); margin-bottom: 2px; }
.chart-tip .tip-val { font-family: var(--mono); }

/* ============ Ошибки ============ */
.error-block { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.error-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.error-msg { font-size: 13px; }
.error-raw summary { cursor: pointer; color: var(--muted); font-size: 11.5px; user-select: none; }
.ch-error {
  background: var(--red-bg); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  border-radius: var(--radius); padding: 10px 12px;
  font-family: var(--mono); font-size: 12px; color: var(--red); white-space: pre-wrap;
}
.ch-error .ch-code { color: var(--red); font-weight: 700; }

/* ============ SQL-консоль ============ */
.sql-layout { display: flex; flex: 1; min-height: 0; min-width: 0; }
.sql-main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px 16px; gap: 10px; }
.sql-editor {
  flex: 1; resize: none; font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  background: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 12px 14px; min-height: 120px;
}

  width: 270px; flex: none; border-left: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel);
}
.sql-side-tabs { display: flex; flex: none; border-bottom: 1px solid var(--border); }
.sql-side-tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; user-select: none; }

.sql-side-body { flex: 1; overflow: auto; padding: 8px; }

}
.ins-item:hover { background: var(--bg-hover); color: var(--accent-text); }
.ins-item span.ins-dim { color: var(--faint); font-size: 10.5px; flex: 1; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.example-item {
  display: block; padding: 7px 9px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); margin-bottom: 7px;

.example-item:hover { border-color: var(--border-strong); background: var(--bg-hover); }

.example-item .ex-desc { font-size: 11px; color: var(--faint); }

.yaml-layout { display: flex; flex: 1; min-height: 0; min-width: 0; }

/* Узкий экран: боковые колонки уходят под редактор, а не давят его до нуля.
   Порог один на весь интерфейс, включая вкладку Завода. */

  .sql-layout, .yaml-layout { flex-direction: column; }
  .sql-side { width: auto; max-height: 240px; border-left: none; border-top: 1px solid var(--border); }

  /* Каталог перекрывает рабочую область, а не отжимает её: на узком экране

  .sidebar { position: absolute; z-index: 6; top: 0; bottom: 0; left: 0;

}

  display: flex; align-items: center; gap: 9px; margin-bottom: 8px;
}

}

<script>
/* ===== src/util.js ===== */
/* ============ Heimdall — утилиты ============ */
"use strict";

const U = {
  $(sel, root) { return (root || document).querySelector(sel); },
  $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },

  esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  },

  el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else if (k === "dataset") Object.assign(node.dataset, v);
        else if (v === true) node.setAttribute(k, "");
        else node.setAttribute(k, v);
      }
    }
    for (const ch of children.flat(Infinity)) {
      if (ch == null || ch === false) continue;
      node.append(ch.nodeType ? ch : document.createTextNode(ch));
    }
    return node;
  },

  debounce(fn, ms) {
    let t = null;
    return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  },

  fmtNum(v) {
    if (typeof v !== "number") return String(v);
    if (Number.isInteger(v)) return v.toLocaleString("ru-RU");
    return v.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  },

  clamp(v, a, b) { return Math.min(b, Math.max(a, v)); },

  clone(o) { return JSON.parse(JSON.stringify(o)); },

  copy(text, label) {
    const finish = (ok) => Toast.show(ok ? (label || "Скопировано в буфер обмена") : "Не удалось скопировать", ok ? "ok" : "err");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => finish(true), () => U.copyFallback(text, finish));
    } else U.copyFallback(text, finish);
  },
  copyFallback(text, finish) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove(); finish(ok);
  },

  download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
  }
};

/* ============ Типы ClickHouse ============ */
const CHTypes = {
  // → { base: 'string'|'number'|'date'|'datetime'|'bool'|'uuid'|'array', nullable, elem }
  parse(t) {
    let s = String(t || "").trim();
    let nullable = false;
    let m;
    while ((m = /^(Nullable|LowCardinality)\((.*)\)$/.exec(s))) {
      if (m[1] === "Nullable") nullable = true;
      s = m[2];
    }
    if ((m = /^Array\((.*)\)$/.exec(s))) {
      return { base: "array", nullable, elem: CHTypes.parse(m[1]) };
    }
    let base = "string";
    if (/^(U?Int\d*|Float\d*|Decimal.*)$/i.test(s)) base = "number";
    else if (/^DateTime/i.test(s)) base = "datetime";
    else if (/^Date/i.test(s)) base = "date";
    else if (/^Bool/i.test(s)) base = "bool";
    else if (/^UUID$/i.test(s)) base = "uuid";
    return { base, nullable, elem: null };
  },
  icon(t) {
    const p = CHTypes.parse(t);
    const map = {
      string: ["T", ""], number: ["#", "t-num"], date: ["◷", "t-date"],
      datetime: ["◷", "t-date"], bool: ["✓", "t-bool"], uuid: ["id", "t-uuid"], array: ["[]", "t-arr"]
    };
    const [ch, cls] = map[p.base] || ["?", ""];
    return `<span class="ticon ${cls}" title="${U.esc(t)}">${ch}</span>`;
  },
  isDateLike(t) { const b = CHTypes.parse(t).base; return b === "date" || b === "datetime"; }
};

/* ============ Гранулярности и даты ============ */
const GRAN = {
  all: ["day", "week", "week_end", "month", "month_end", "quarter", "quarter_end", "year", "year_end", "hour", "minute"],
  labels: {
    day: "день", week: "неделя", week_end: "конец недели", month: "месяц", month_end: "конец месяца",
    quarter: "квартал", quarter_end: "конец квартала", year: "год", year_end: "конец года",
    hour: "час", minute: "минута"
  },
  sqlFn: {
    day: "toDate", week: "toStartOfWeek", week_end: "toLastDayOfWeek",
    month: "toStartOfMonth", month_end: "toLastDayOfMonth",
    quarter: "toStartOfQuarter", quarter_end: "toLastDayOfQuarter",
    year: "toStartOfYear", year_end: "toLastDayOfYear",
    hour: "toStartOfHour", minute: "toStartOfMinute"
  },
  stepExpr: {
    day: "toIntervalDay(1)", week: "toIntervalWeek(1)", week_end: "toIntervalWeek(1)",
    month: "toIntervalMonth(1)", month_end: "toIntervalMonth(1)",
    quarter: "toIntervalQuarter(1)", quarter_end: "toIntervalQuarter(1)",
    year: "toIntervalYear(1)", year_end: "toIntervalYear(1)",
    hour: "toIntervalHour(1)", minute: "toIntervalMinute(1)"
  }
};

const Dates = {
  iso(d) {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  },
  parse(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  },
  addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; },
  addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; },
  lastOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); },

  // даты-метки бакетов в [from, to)
  buckets(fromISO, toISO, gran) {
    const from = Dates.parse(fromISO), to = Dates.parse(toISO);
    if (!from || !to || from >= to) return [];
    const out = [];
    const push = (d) => { if (d >= from && d < to) out.push(Dates.iso(d)); };
    let guard = 0;
    if (gran === "day" || gran === "hour" || gran === "minute") {
      let cur = new Date(from);
      while (cur < to && guard++ < 1500) { push(cur); cur = Dates.addDays(cur, 1); }
    } else if (gran === "week" || gran === "week_end") {
      // начало недели = понедельник
      let cur = new Date(from);
      const dow = (cur.getDay() + 6) % 7;
      cur = Dates.addDays(cur, -dow);
      while (cur < to && guard++ < 800) {
        push(gran === "week_end" ? Dates.addDays(cur, 6) : cur);
        cur = Dates.addDays(cur, 7);
      }
    } else if (gran === "month" || gran === "month_end") {
      let cur = new Date(from.getFullYear(), from.getMonth(), 1);
      while (cur < to && guard++ < 400) {
        push(gran === "month_end" ? Dates.lastOfMonth(cur) : cur);
        cur = Dates.addMonths(cur, 1);
      }
    } else if (gran === "quarter" || gran === "quarter_end") {
      let cur = new Date(from.getFullYear(), Math.floor(from.getMonth() / 3) * 3, 1);
      while (cur < to && guard++ < 200) {
        push(gran === "quarter_end" ? Dates.lastOfMonth(Dates.addMonths(cur, 2)) : cur);
        cur = Dates.addMonths(cur, 3);
      }
    } else if (gran === "year" || gran === "year_end") {
      let cur = new Date(from.getFullYear(), 0, 1);
      while (cur < to && guard++ < 100) {
        push(gran === "year_end" ? new Date(cur.getFullYear(), 11, 31) : cur);
        cur = Dates.addMonths(cur, 12);
      }
    }
    if (!out.length) {
      // диапазон уже одного бакета — вернуть хотя бы стартовую точку
      out.push(fromISO);
    }
    return out;
  },

  spanYears(fromISO, toISO) {
    const f = Dates.parse(fromISO), t = Dates.parse(toISO);
    if (!f || !t) return 0;
    return (t - f) / (365.25 * 24 * 3600 * 1000);
  },

  parseLookback(s) { // "5y" | "18m" | "90d" → годы
    const m = /^(\d+)\s*([ymd])$/.exec(String(s || "").trim());
    if (!m) return 100;
    const n = +m[1];
    return m[2] === "y" ? n : m[2] === "m" ? n / 12 : n / 365.25;
  }
};

/* ============ Подсветка синтаксиса ============ */
const Hl = {
  SQL_KW: /\b(SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|OFFSET|BY|AS|AND|OR|NOT|IN|LIKE|ILIKE|IS|NULL|JOIN|LEFT|RIGHT|INNER|FULL|ON|WITH|FILL|STEP|TO|INTERPOLATE|SETTINGS|DESCRIBE|DESC|SHOW|TABLES|UNION|ALL|DISTINCT|CASE|WHEN|THEN|ELSE|END|BETWEEN|ASC|DESC|ARRAY|FIRST|LAST|NULLS|INTERVAL|YEAR|MONTH|DAY|PREWHERE|FINAL|SAMPLE|USING|EXISTS|ANY|HAVING)\b/gi,

  sql(src) {
    let s = U.esc(src);
    // комментарии и строки сначала (защита плейсхолдерами без цифр,
    // иначе проход по числам разрушает индексы плейсхолдеров)
    const stash = [];
    const phEncode = (n) => String(n).replace(/\d/g, (d) => "abcdefghij"[+d]);
    const phDecode = (s2) => +s2.split("").map((c) => "abcdefghij".indexOf(c)).join("");
    const keep = (cls, text) => { stash.push(`<span class="${cls}">${text}</span>`); return `\u0000${phEncode(stash.length - 1)}\u0000`; };
    s = s.replace(/\/\*[\s\S]*?\*\//g, (m) => keep("tok-com", m));
    s = s.replace(/--[^\n]*/g, (m) => keep("tok-com", m));
    s = s.replace(/&#39;(?:[^&]|&(?!#39;))*?&#39;/g, (m) => keep("tok-str", m));
    s = s.replace(Hl.SQL_KW, (m) => keep("tok-kw", m));
    s = s.replace(/\b([A-Za-z_][A-Za-z0-9_]*)\s*(?=\()/g, (m, fn) => keep("tok-fn", fn));
    s = s.replace(/\b\d+(\.\d+)?\b/g, (m) => keep("tok-num", m));
    s = s.replace(/\u0000([a-j]+)\u0000/g, (m, i) => stash[phDecode(i)]);
    return s;
  },

  json(src) {
    let s = typeof src === "string" ? src : JSON.stringify(src, null, 2);
    s = U.esc(s);
    s = s.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?/g, (m, str, colon) =>
      colon ? `<span class="tok-key">${str}</span>${colon}` : `<span class="tok-str">${str}</span>`);
    s = s.replace(/\b(-?\d+(\.\d+)?([eE][+-]?\d+)?)\b/g, '<span class="tok-num">$1</span>');
    s = s.replace(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>');
    return s;
  },

  yaml(src) {
    return U.esc(src).split("\n").map((line) => {
      if (/^\s*#/.test(line)) return `<span class="tok-com">${line}</span>`;
      let out = line;
      // комментарий в конце строки
      let comment = "";
      const ci = out.search(/\s#\s/);
      if (ci >= 0) { comment = `<span class="tok-com">${out.slice(ci)}</span>`; out = out.slice(0, ci); }
      out = out.replace(/^(\s*-?\s*)([A-Za-z_][A-Za-z0-9_]*)(:)/, (m, pre, key, colon) =>
        `${pre}<span class="tok-key">${key}</span><span class="tok-punct">${colon}</span>`);
      out = out.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '<span class="tok-str">$1</span>');
      out = out.replace(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>');
      out = out.replace(/(:\s|\[|,\s)(-?\d+(\.\d+)?)(?=[,\s\]]|$)/g, '$1<span class="tok-num">$2</span>');
      return out + comment;
    }).join("\n");
  },

  chError(text) {
    let s = U.esc(text);
    s = s.replace(/^(Code:\s*\d+\.)/, '<span class="ch-code">$1</span>');
    s = s.replace(/\(([A-Z_]{4,})\)/g, '(<span class="ch-code">$1</span>)');
    return s;
  }
};

/* ============ Тосты ============ */
const Toast = {
  show(msg, kind) {
    const root = U.$("#toastRoot");
    const t = U.el("div", { class: `toast t-${kind || "ok"}` }, msg);
    root.append(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity 0.3s"; }, 2300);
    setTimeout(() => t.remove(), 2700);
  }
};

/* ============ Глобальный тултип ============ */
const Tip = {
  init() {
    const tip = U.el("div", { class: "hover-tip" });
    document.body.append(tip);
    document.addEventListener("mouseover", (e) => {
      const t = e.target.closest("[data-tip]");
      if (!t) { tip.style.display = "none"; return; }
      tip.innerHTML = t.dataset.tip;
      tip.style.display = "block";
      const r = t.getBoundingClientRect();
      tip.style.left = Math.min(r.left, window.innerWidth - 400) + "px";
      tip.style.top = (r.bottom + 6) + "px";
    });
    document.addEventListener("mouseout", (e) => {
      if (e.target.closest("[data-tip]")) tip.style.display = "none";
    });
  }
};

/* ============ Русские сообщения ошибок REST ============ */
const ERROR_RU = {
  "query-empty": "Выберите хотя бы колонки или метрики",
  "rows-requires-dimensions": "Для плоских строк нужны колонки",
  "history-requires-metrics": "Запрос по истории требует хотя бы одну метрику",
  "time-dimensions-not-applicable": "Эта модель не историческая — временное измерение не применимо",
  "granularity-not-allowed": "Такой шаг времени не разрешён для этой колонки",
  "column-not-a-time-dimension": "Эта колонка не является временным измерением",
  "param-metric-not-supported": "Параметризованные метрики пока не поддержаны в REST",
  "param-virtual-not-supported": "Параметризованные колонки пока не поддержаны в REST",
  "order-by-metric-not-allowed-in-rows": "Сортировка по метрике доступна только при агрегации",
  "limit-by-not-supported-in-history": "LIMIT BY не работает в исторических запросах",
  "array-join-not-supported-in-history": "Развёртка массивов не работает в исторических запросах",
  "missing-time-range": "Укажите период или дату среза",
  "range-exceeds-lookback": "Период шире допустимой глубины истории",
  "extra_forbidden": "В запросе есть неизвестные поля",
  "network": "Нет соединения с сервером. Проверьте base URL; для обхода CORS откройте файл с того же origin, что сервис.",
  "unknown-column": "Неизвестная колонка",
  "unknown-metric": "Неизвестная метрика",
  "order-by-kind-mismatch": "Вид поля в сортировке (kind) не совпадает с фактическим",
  "forbidden": "Доступ запрещён",
  "request-validation-error": "Тело запроса не прошло проверку",
  "clickhouse-query-error": "Ошибка выполнения запроса в ClickHouse",
  "clickhouse-unavailable": "ClickHouse недоступен, повторите запрос позже",
  "internal-error": "Внутренняя ошибка сервера (request_id — в ответе)"
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { U, CHTypes, GRAN, Dates, Hl, Toast, Tip, ERROR_RU });

</script>
<script>
/* ===== src/api.js ===== */
/* ============ Heimdall — API-слой ============ */
"use strict";

class ApiError extends Error {
  constructor(status, code, detail, raw) {
    super(detail || code);
    this.status = status; this.code = code; this.detail = detail;
    this.raw = raw || { code, detail };
  }
}

/* ---------- Помощники по модели ---------- */
const ModelInfo = {
  key(m) { return `${m.schema_name}.${m.logic_model}`; },
  kindBadges(m) {
    const out = [];
    if (m.history) out.push(["history", "⏱", "b-history"]);
    if (m.array_join) out.push(["array_join", "⊞", "b-array"]);
    if (m.joins && m.joins.length) out.push(["joined", "⇄", "b-joins"]);
    if (!out.length) out.push(["обычный", "▦", "b-plain"]);
    return out;
  },
  // все видимые колонки: обычные + виртуальные + параметризованные (с флагами)
  allColumns(m) {
    const out = [];
    for (const c of m.columns || []) out.push({ ...c, _kind: "column" });
    for (const c of m.virtual_columns || []) out.push({ ...c, _kind: "virtual" });
    for (const c of m.param_virtual_columns || []) out.push({ ...c, _kind: "param" });
    return out;
  },
  allMetrics(m) {
    const out = [];
    for (const x of m.metrics || []) out.push({ ...x, _kind: "metric" });
    for (const x of m.param_metrics || []) out.push({ ...x, _kind: "param" });
    return out;
  },
  column(m, name) { return ModelInfo.allColumns(m).find((c) => c.column_name === name) || null; },
  metric(m, name) { return ModelInfo.allMetrics(m).find((x) => x.metric_name === name) || null; },
  timeColumns(m) {
    return (m.columns || []).filter((c) => Array.isArray(c.granularities) && c.granularities.length);
  }
};

/* ============ Логика запроса: режим, валидация, SQL ============ */
const QueryLogic = {
  ALLOWED_FIELDS: ["columns", "metrics", "time_dimensions", "filters", "order_by", "limit", "offset", "limit_by"],

  mode(body) {
    if (Array.isArray(body.time_dimensions) && body.time_dimensions.length) return "history";
    if (Array.isArray(body.metrics) && body.metrics.length) return "aggregate";
    return "rows";
  },

  validate(model, body) {
    const err = (status, code, detail) => new ApiError(status, code, detail);
    for (const k of Object.keys(body)) {
      if (!QueryLogic.ALLOWED_FIELDS.includes(k))
        return err(422, "extra_forbidden", `Неизвестное поле тела запроса: '${k}'`);
    }
    const cols = body.columns || [], mets = body.metrics || [];
    const tds = body.time_dimensions || [];
    const mode = QueryLogic.mode(body);

    if (body.limit != null && (body.limit < 1 || body.limit > 1000))
      return err(422, "extra_forbidden", "limit должен быть в диапазоне 1..1000");

    // неизвестные имена
    for (const c of cols) {
      if (!ModelInfo.column(model, c)) return err(400, "unknown-column", `Колонка '${c}' не найдена в модели '${model.logic_model}'`);
    }
    for (const m of mets) {
      if (!ModelInfo.metric(model, m)) return err(400, "unknown-metric", `Метрика '${m}' не найдена в модели '${model.logic_model}'`);
    }

    // параметризованные элементы
    for (const m of mets) {
      const mm = ModelInfo.metric(model, m);
      if (mm && mm._kind === "param") return err(422, "param-metric-not-supported", `Метрика '${m}' параметризована и недоступна через REST`);
    }
    for (const c of cols) {
      const cc = ModelInfo.column(model, c);
      if (cc && cc._kind === "param") return err(422, "param-virtual-not-supported", `Колонка '${c}' параметризована и недоступна через REST`);
    }

    if (tds.length) {
      if (!model.history) return err(422, "time-dimensions-not-applicable", `Модель '${model.logic_model}' не историческая`);
      if (tds.length > 1) return err(422, "extra_forbidden", "time_dimensions может содержать только один элемент");
      const td = tds[0];
      const col = (model.columns || []).find((c) => c.column_name === td.name);
      if (!col) return err(400, "unknown-column", `Колонка '${td.name}' не найдена`);
      if (!Array.isArray(col.granularities) || !col.granularities.length)
        return err(422, "column-not-a-time-dimension", `Колонка '${td.name}' не является временным измерением`);
      if (td.granularity && !col.granularities.includes(td.granularity))
        return err(422, "granularity-not-allowed", `Гранулярность '${td.granularity}' не разрешена для '${td.name}'. Доступно: ${col.granularities.join(", ")}`);
      if (!td.range || !td.range.from || !td.range.to)
        return err(422, "missing-time-range", "Не задан период: укажите range.from и range.to");
      const lookback = Dates.parseLookback(model.history.lookback_safety?.default_lookback || "100y");
      if (Dates.spanYears(td.range.from, td.range.to) > lookback)
        return err(422, "range-exceeds-lookback", `Период превышает допустимую глубину истории (${model.history.lookback_safety.default_lookback})`);
      if (!mets.length) return err(422, "history-requires-metrics", "Исторический запрос требует хотя бы одну метрику");
      if (body.limit_by) return err(422, "limit-by-not-supported-in-history", "limit_by запрещён в историческом режиме");
    }

    if (mode === "rows") {
      if (!cols.length && !mets.length) return err(422, "query-empty", "Тело запроса пустое: нет ни колонок, ни метрик");
      for (const ob of body.order_by || []) {
        const kind = ob.kind || (ModelInfo.metric(model, ob.field) ? "metric" : "column");
        if (kind === "metric") return err(422, "order-by-metric-not-allowed-in-rows", `Сортировка по метрике '${ob.field}' недоступна в режиме строк`);
      }
    }
    if (mode === "aggregate" && body.limit_by && model.history)
      return err(422, "limit-by-not-supported-in-history", "limit_by запрещён для исторических моделей");
    return null;
  },

  /* ---------- значение → SQL-литерал ---------- */
  lit(v) {
    if (v == null) return "NULL";
    if (typeof v === "number") return String(v);
    if (typeof v === "boolean") return v ? "true" : "false";
    return `'${String(v).replace(/'/g, "\\'")}'`;
  },

  filterSql(node) {
    if (!node) return "";
    switch (node.type) {
      case "condition":
        return `${node.column} ${node.operator} ${QueryLogic.lit(node.value)}`;
      case "condition_in":
        return `${node.column} ${node.operator} (${(node.value || []).map(QueryLogic.lit).join(", ")})`;
      case "condition_like":
        return `${node.column} ${node.operator} ${QueryLogic.lit(node.pattern)}`;
      case "condition_null":
        return `${node.column} ${node.operator}`;
      case "condition_array":
        if (node.operator === "has") return `has(${node.column}, ${QueryLogic.lit(node.value)})`;
        return `${node.operator}(${node.column}, [${(node.value || []).map(QueryLogic.lit).join(", ")}])`;
      case "and": case "or": {
        const parts = (node.conditions || []).map(QueryLogic.filterSql).filter(Boolean);
        if (!parts.length) return "";
        return `(${parts.join(node.type === "and" ? " AND " : " OR ")})`;
      }
      case "not": {
        const inner = QueryLogic.filterSql(node.condition);
        return inner ? `NOT (${inner})` : "";
      }
    }
    return "";
  },

  colExpr(model, name) {
    const c = ModelInfo.column(model, name);
    if (c && c.sql) return `${c.sql} AS ${name}`;
    return name;
  },

  orderBySql(body) {
    const obs = body.order_by || [];
    if (!obs.length) return "";
    return "ORDER BY " + obs.map((o) =>
      `${o.field} ${(o.direction || "asc").toUpperCase()}${o.nulls ? ` NULLS ${o.nulls.toUpperCase()}` : ""}`
    ).join(", ");
  },

  buildSql(model, body) {
    const mode = QueryLogic.mode(body);
    const tbl = `${model.schema_name}.${model.table_name}`;
    const where = QueryLogic.filterSql(body.filters);
    const lim = `LIMIT ${body.limit ?? 100}${body.offset ? ` OFFSET ${body.offset}` : ""}`;
    const limitBy = body.limit_by ? `LIMIT ${body.limit_by.limit} BY ${body.limit_by.by.join(", ")}` : "";

    if (mode === "history") {
      const td = body.time_dimensions[0];
      const gran = td.granularity || "day";
      const fn = GRAN.sqlFn[gran] || "toDate";
      const h = model.history;
      const metricSel = body.metrics.map((m) => {
        const mm = ModelInfo.metric(model, m);
        return `    ${mm ? mm.sql : m + "()"} AS ${m}`;
      });
      const dims = (body.columns || []);
      const dimSel = dims.map((c) => `    ${c}`);
      const groupKeys = [td.name, ...dims].join(", ");
      const interp = body.metrics.map((m) => `${m} AS ${m}`).join(", ");
      return [
        `SELECT`,
        `    ${fn}(${td.name}) AS ${td.name},`,
        ...dimSel.map((s) => s + ","),
        metricSel.join(",\n"),
        `FROM`,
        `(`,
        `    SELECT *, ${ModelInfo.column(model, td.name)?.sql || `toDate32(${h.valid_from})`} AS ${td.name}`,
        `    FROM ${tbl}`,
        `    WHERE ${h.valid_from} >= toDate('${td.range.from}') - INTERVAL ${Math.ceil(Dates.parseLookback(h.lookback_safety?.default_lookback || "5y"))} YEAR`,
        `      AND ${h.valid_from} < toDate('${td.range.to}')`,
        where ? `      AND ${where}` : null,
        `    ORDER BY ${h.primary_key}, ${h.valid_from}`,
        `)`,
        `WHERE ${td.name} >= toDate('${td.range.from}') AND ${td.name} < toDate('${td.range.to}')`,
        `GROUP BY ${groupKeys}`,
        `ORDER BY ${td.name} ASC WITH FILL`,
        `    FROM ${fn}(toDate('${td.range.from}'))`,
        `    TO toDate('${td.range.to}')`,
        `    STEP ${GRAN.stepExpr[gran] || "toIntervalDay(1)"}`,
        (td.fill?.mode || h.fill?.mode) === "previous" ? `INTERPOLATE (${interp})` : null,
        lim,
        `SETTINGS enable_analyzer = 1`
      ].filter((x) => x != null).join("\n");
    }

    if (mode === "aggregate") {
      const dims = body.columns || [];
      const sel = [
        ...dims.map((c) => `    ${QueryLogic.colExpr(model, c)}`),
        ...body.metrics.map((m) => {
          const mm = ModelInfo.metric(model, m);
          return `    ${mm ? mm.sql : m + "()"} AS ${m}`;
        })
      ];
      return [
        `SELECT`,
        sel.join(",\n"),
        `FROM ${tbl}`,
        where ? `WHERE ${where}` : null,
        dims.length ? `GROUP BY ${dims.join(", ")}` : null,
        QueryLogic.orderBySql(body) || null,
        limitBy || null,
        lim,
        `SETTINGS enable_analyzer = 1`
      ].filter((x) => x != null).join("\n");
    }

    // rows
    return [
      `SELECT`,
      (body.columns || []).map((c) => `    ${QueryLogic.colExpr(model, c)}`).join(",\n"),
      `FROM ${tbl}`,
      where ? `WHERE ${where}` : null,
      QueryLogic.orderBySql(body) || null,
      limitBy || null,
      lim,
      `SETTINGS enable_analyzer = 1`
    ].filter((x) => x != null).join("\n");
  },

  curl(baseUrl, token, model, body) {
    const url = `${(baseUrl || "http://localhost:8000").replace(/\/+$/, "")}/api/v1/${model.schema_name}/${model.logic_model}/`;
    return [
      `curl -X POST '${url}' \\`,
      `  -H 'Content-Type: application/json' \\`,
      token ? `  -H 'Authorization: Bearer ${token}' \\` : `  -H 'Authorization: Bearer <JWT>' \\`,
      `  -d '${JSON.stringify(body)}'`
    ].join("\n");
  }
};

/* ============ HttpApiClient (live) ============ */
class HttpApiClient {
  constructor(baseUrl, token) {
    this.kind = "live";
    this.base = String(baseUrl || "").replace(/\/+$/, "");
    this.token = token || "";
  }
  _headers(json) {
    const h = {};
    if (json) h["Content-Type"] = "application/json";
    if (this.token) h["Authorization"] = `Bearer ${this.token}`;
    return h;
  }
  async _fetch(url, opts) {
    let resp;
    try {
      resp = await fetch(url, opts);
    } catch (e) {
      throw new ApiError(0, "network", ERROR_RU.network, { error: String(e) });
    }
    return resp;
  }
  async ping() {
    const t0 = performance.now();
    const r = await this._fetch(`${this.base}/ping`, { headers: this._headers(false) });
    if (!r.ok) throw new ApiError(r.status, "ping-failed", `Сервер ответил ${r.status}`);
    return { ok: true, latency: Math.round(performance.now() - t0) };
  }
  async _json(r) {
    const text = await r.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) { /* не JSON */ }
    if (!r.ok) {
      const code = data?.code || `http-${r.status}`;
      throw new ApiError(r.status, code, data?.detail || text.slice(0, 500), data || { raw: text });
    }
    return data;
  }
  async listTables() {
    const r = await this._fetch(`${this.base}/api/v1/tables/`, { headers: this._headers(false) });
    return this._json(r);
  }
  async getTable(schema, name) {
    const r = await this._fetch(`${this.base}/api/v1/tables/${schema}/${name}/`, { headers: this._headers(false) });
    return this._json(r);
  }
  async query(schema, name, body, opts) {
    const q = opts && opts.raw ? "?query_type=raw" : "";
    const r = await this._fetch(`${this.base}/api/v1/${schema}/${name}/${q}`, {
      method: "POST", headers: this._headers(true), body: JSON.stringify(body)
    });
    return this._json(r);
  }
  async sql(text) {
    const r = await this._fetch(`${this.base}/`, {
      method: "POST",
      headers: { ...this._headers(false), "Content-Type": "text/plain" },
      body: text
    });
    const out = await r.text();
    if (!r.ok) return { ok: false, error: out };
    return { ok: true, text: out };
  }
  async publishYaml(yamlText, schemaName) {
    const fd = new FormData();
    fd.append("yaml_file", new Blob([yamlText], { type: "application/yaml" }), "dataset.yaml");
    const q = schemaName ? `?schema_name=${encodeURIComponent(schemaName)}` : "";
    const r = await this._fetch(`${this.base}/api/v1/dev/add_yaml_for_debug/${q}`, {
      method: "POST", headers: this._headers(false), body: fd
    });
    return this._json(r);
  }
}

/* ============ Фасад: текущий клиент по настройкам ============ */
const Api = {
  client() {
    const s = App.settings;
    return new HttpApiClient(s.baseUrl, s.token);
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { ApiError, ModelInfo, QueryLogic, HttpApiClient, Api });

</script>
<script>
/* ===== src/yamlcodec.js ===== */
/* ============ Heimdall — YAML-кодек (генерация + упрощённый парсер) ============ */
"use strict";

const YamlCodec = {
  /* ---------- генерация ---------- */
  q(v) {
    if (v == null) return "null";
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    const s = String(v);
    if (s === "") return '""';
    const plain = /^[A-Za-z0-9_][A-Za-z0-9_.\-\/()]*$/.test(s);
    if (plain) return s;
    return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  },
  inlineList(arr) { return "[" + (arr || []).map((x) => YamlCodec.q(x)).join(", ") + "]"; },

  generate(ds) {
    const L = [];
    const p2 = "  ", p4 = "    ", p6 = "      ", p8 = "        ";
    L.push("datasets:");
    L.push(`${p2}- logic_model: ${YamlCodec.q(ds.logic_model)}`);
    L.push(`${p4}table_name: ${YamlCodec.q(ds.table_name)}`);
    L.push(`${p4}schema_name: ${YamlCodec.q(ds.schema_name)}`);
    if (ds.description) L.push(`${p4}description: ${YamlCodec.q(ds.description)}`);
    if (ds.allowed_groups && ds.allowed_groups.length) L.push(`${p4}allowed_groups: ${YamlCodec.inlineList(ds.allowed_groups)}`);
    if (ds.disallowed_groups && ds.disallowed_groups.length) L.push(`${p4}disallowed_groups: ${YamlCodec.inlineList(ds.disallowed_groups)}`);
    if (ds.visible && ds.visible.length) L.push(`${p4}visible: ${YamlCodec.inlineList(ds.visible)}`);

    if (ds.history) {
      const h = ds.history;
      L.push("");
      L.push(`${p4}history:`);
      L.push(`${p6}valid_from: ${YamlCodec.q(h.valid_from)}`);
      L.push(`${p6}primary_key: ${YamlCodec.q(h.primary_key)}`);
      L.push(`${p6}time_column: ${YamlCodec.q(h.time_column)}`);
      L.push(`${p6}require_time_range: ${h.require_time_range ? "true" : "false"}`);
      L.push(`${p6}fill: { mode: ${h.fill?.mode || "previous"} }`);
      L.push(`${p6}lookback_safety: { default_lookback: ${h.lookback_safety?.default_lookback || "5y"} }`);
    }

    const colBlock = (name, cols, isMetric) => {
      L.push("");
      if (!cols || !cols.length) { L.push(`${p4}${name}: []`); return; }
      L.push(`${p4}${name}:`);
      for (const c of cols) {
        if (isMetric) {
          L.push(`${p6}- metric_name: ${YamlCodec.q(c.metric_name)}`);
          if (c.type) L.push(`${p8}type: ${YamlCodec.q(c.type)}`);
          L.push(`${p8}sql: ${YamlCodec.q(c.sql)}`);
          if (c.verbose_name) L.push(`${p8}verbose_name: ${YamlCodec.q(c.verbose_name)}`);
          if (c.description) L.push(`${p8}description: ${YamlCodec.q(c.description)}`);
          if (c.parameters && c.parameters.length) {
            L.push(`${p8}parameters:`);
            for (const pp of c.parameters)
              L.push(`${p8}  - { name: ${YamlCodec.q(pp.name)}, type: ${YamlCodec.q(pp.type)}${pp.description ? `, description: ${YamlCodec.q(pp.description)}` : ""} }`);
          }
        } else {
          L.push(`${p6}- column_name: ${YamlCodec.q(c.column_name)}`);
          L.push(`${p8}type: ${YamlCodec.q(c.type || "String")}`);
          if (c.description) L.push(`${p8}description: ${YamlCodec.q(c.description)}`);
          if (c.sql) L.push(`${p8}sql: ${YamlCodec.q(c.sql)}`);
          if (c.granularities && c.granularities.length) {
            L.push(`${p8}granularities: ${YamlCodec.inlineList(c.granularities)}`);
            if (c.default_granularity) L.push(`${p8}default_granularity: ${YamlCodec.q(c.default_granularity)}`);
          }
          if (c.parameters && c.parameters.length) {
            L.push(`${p8}parameters:`);
            for (const pp of c.parameters)
              L.push(`${p8}  - { name: ${YamlCodec.q(pp.name)}, type: ${YamlCodec.q(pp.type)} }`);
          }
        }
      }
    };
    colBlock("columns", ds.columns, false);
    colBlock("virtual_columns", ds.virtual_columns, false);
    colBlock("param_virtual_columns", ds.param_virtual_columns, false);
    colBlock("metrics", ds.metrics, true);
    colBlock("param_metrics", ds.param_metrics, true);

    L.push("");
    L.push(`${p4}joins: ${(ds.joins && ds.joins.length) ? "" : "[]"}`);
    if (ds.joins && ds.joins.length) {
      for (const j of ds.joins)
        L.push(`${p6}- { logic_model: ${YamlCodec.q(j.logic_model)}, schema_name: ${YamlCodec.q(j.schema_name)}, type: ${YamlCodec.q(j.type || "left")}, on: ${YamlCodec.q(j.on)} }`);
    }
    if (ds.array_join) {
      L.push(`${p4}array_join:`);
      L.push(`${p6}type: ${YamlCodec.q(ds.array_join.type || "left")}`);
      if (ds.array_join.source_model)
        L.push(`${p6}source_model: ${YamlCodec.q(ds.array_join.source_model)}`);
      L.push(`${p6}arrays:`);
      for (const a of ds.array_join.arrays || [])
        L.push(`${p8}- { source: ${YamlCodec.q(a.source)}, as: ${YamlCodec.q(a.as)}, element_type: ${YamlCodec.q(a.element_type)} }`);
    } else {
      L.push(`${p4}array_join: null`);
    }
    return L.join("\n") + "\n";
  },

  /* ---------- упрощённый парсер нашего подмножества YAML ---------- */
  parse(text) {
    const rawLines = String(text || "").split("\n");
    const lines = [];
    for (const raw of rawLines) {
      // срезаем комментарии вне кавычек (упрощённо)
      let line = raw.replace(/\t/g, "  ");
      let inS = false, inD = false, cut = -1;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === "'" && !inD) inS = !inS;
        else if (ch === '"' && !inS && line[i - 1] !== "\\") inD = !inD;
        else if (ch === "#" && !inS && !inD && (i === 0 || /\s/.test(line[i - 1]))) { cut = i; break; }
      }
      if (cut >= 0) line = line.slice(0, cut);
      if (!line.trim()) continue;
      const indent = line.match(/^ */)[0].length;
      lines.push({ indent, text: line.trim() });
    }
    if (!lines.length) throw new Error("пустой документ");
    const [val] = YamlCodec._block(lines, 0, lines[0].indent);
    return val;
  },

  _block(lines, i, indent) {
    if (i >= lines.length) return [null, i];
    if (lines[i].text.startsWith("- ") || lines[i].text === "-") return YamlCodec._list(lines, i, indent);
    return YamlCodec._map(lines, i, indent);
  },

  _list(lines, i, indent) {
    const out = [];
    while (i < lines.length && lines[i].indent === indent && (lines[i].text.startsWith("- ") || lines[i].text === "-")) {
      const rest = lines[i].text === "-" ? "" : lines[i].text.slice(2);
      if (!rest) {
        // элемент на следующих строках
        const [v, ni] = YamlCodec._block(lines, i + 1, lines[i + 1] ? lines[i + 1].indent : indent + 2);
        out.push(v); i = ni;
      } else if (/^[A-Za-z_][\w]*\s*:/.test(rest) && !rest.startsWith("{")) {
        // элемент-словарь: первая пара на строке с "-"
        const virtIndent = indent + 2;
        const sub = [{ indent: virtIndent, text: rest }];
        let j = i + 1;
        while (j < lines.length && lines[j].indent > indent && !(lines[j].indent === indent && lines[j].text.startsWith("- "))) {
          if (lines[j].indent <= indent) break;
          sub.push(lines[j]); j++;
        }
        const [v] = YamlCodec._map(sub, 0, virtIndent);
        out.push(v); i = j;
      } else {
        out.push(YamlCodec._scalar(rest)); i++;
      }
    }
    return [out, i];
  },

  _map(lines, i, indent) {
    const out = {};
    while (i < lines.length && lines[i].indent === indent && !lines[i].text.startsWith("- ")) {
      const m = /^([A-Za-z_][\w]*)\s*:\s*(.*)$/.exec(lines[i].text);
      if (!m) throw new Error(`строка не похожа на key: value — «${lines[i].text}»`);
      const key = m[1], rest = m[2];
      if (rest === "") {
        // вложенный блок
        if (i + 1 < lines.length && lines[i + 1].indent > indent) {
          const [v, ni] = YamlCodec._block(lines, i + 1, lines[i + 1].indent);
          out[key] = v; i = ni;
        } else { out[key] = null; i++; }
      } else {
        out[key] = YamlCodec._scalar(rest); i++;
      }
    }
    return [out, i];
  },

  _scalar(s) {
    s = s.trim();
    if (s === "" || s === "null" || s === "~") return null;
    if (s === "true") return true;
    if (s === "false") return false;
    if (s.startsWith("[")) return YamlCodec._inlineList(s);
    if (s.startsWith("{")) return YamlCodec._inlineMap(s);
    if (/^"(.*)"$/.test(s)) return s.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\");
    if (/^'(.*)'$/.test(s)) return s.slice(1, -1).replace(/''/g, "'");
    if (/^-?\d+$/.test(s)) return parseInt(s, 10);
    if (/^-?\d+\.\d+$/.test(s)) return parseFloat(s);
    return s;
  },

  _splitTop(s) {
    const out = []; let depth = 0, cur = "", inS = false, inD = false;
    for (const ch of s) {
      if (ch === "'" && !inD) inS = !inS;
      if (ch === '"' && !inS) inD = !inD;
      if (!inS && !inD) {
        if (ch === "[" || ch === "{") depth++;
        if (ch === "]" || ch === "}") depth--;
        if (ch === "," && depth === 0) { out.push(cur); cur = ""; continue; }
      }
      cur += ch;
    }
    if (cur.trim()) out.push(cur);
    return out.map((x) => x.trim());
  },

  _inlineList(s) {
    const inner = s.replace(/^\[/, "").replace(/\]$/, "").trim();
    if (!inner) return [];
    return YamlCodec._splitTop(inner).map(YamlCodec._scalar);
  },

  _inlineMap(s) {
    const inner = s.replace(/^\{/, "").replace(/\}$/, "").trim();
    const out = {};
    if (!inner) return out;
    for (const pair of YamlCodec._splitTop(inner)) {
      const m = /^([A-Za-z_][\w]*)\s*:\s*(.*)$/.exec(pair);
      if (!m) throw new Error(`плохая пара в инлайн-словаре: «${pair}»`);
      out[m[1]] = YamlCodec._scalar(m[2]);
    }
    return out;
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { YamlCodec });

</script>
<script>
/* ===== src/results.js ===== */
/* ============ Heimdall — нижняя панель: результаты, график, JSON, SQL, ошибки ============ */
"use strict";

const Bp = {
  state: { result: null, ctx: null, json: null, sql: null, error: null, active: "result" },
  TABS: [
    ["result", "Результат"], ["chart", "График"], ["json", "JSON тела"], ["sql", "SQL"], ["error", "Ошибка"]
  ],

  init() {
    const tabsEl = U.$("#bpTabs");
    tabsEl.innerHTML = "";
    for (const [id, label] of Bp.TABS) {
      tabsEl.append(U.el("div", {
        class: "bp-tab", dataset: { bptab: id },
        onclick: () => Bp.show(id)
      }, label, U.el("span", { class: "bp-dot", style: "display:none" })));
    }
    tabsEl.append(U.el("span", { style: "flex:1" }));
    tabsEl.append(U.el("button", {
      class: "ghost iconbtn", id: "bpCollapse", title: "Свернуть/развернуть панель",
      onclick: () => U.$("#bottomPanel").classList.toggle("collapsed")
    }, "▾"));
    window.addEventListener("resize", U.debounce(() => { if (Bp.state.active === "chart") Bp.render(); }, 200));
    Bp.show("result");
  },

  expand() { U.$("#bottomPanel").classList.remove("collapsed"); },

  show(tab) {
    Bp.state.active = tab;
    U.$$("#bpTabs .bp-tab").forEach((t) => t.classList.toggle("active", t.dataset.bptab === tab));
    Bp.render();
  },

  dot(tab, color) {
    const t = U.$(`#bpTabs .bp-tab[data-bptab="${tab}"] .bp-dot`);
    if (!t) return;
    if (!color) { t.style.display = "none"; return; }
    t.style.display = "inline-block";
    t.style.background = `var(--${color})`;
  },

  loading() {
    Bp.expand();
    Bp.show("result");
    const body = U.$("#bpBody");
    body.innerHTML = "";
    body.append(U.el("div", { class: "skeleton-rows" },
      ...[95, 88, 92, 70, 85, 60].map((w) => { const d = U.el("div", { class: "sk-line" }); d.style.width = w + "%"; return d; })));
  },

  setResult(result, ctx) {
    Bp.state.result = result; Bp.state.ctx = ctx || null;
    Bp.state.error = null;
    Bp.dot("error", null);
    Bp.dot("result", "green");
    Bp.dot("chart", ctx && ctx.mode === "history" ? "accent-text" : null);
    Bp.expand();
    Bp.show(ctx && ctx.preferChart ? "chart" : "result");
  },

  setJson(body) { Bp.state.json = body; if (Bp.state.active === "json") Bp.render(); },
  setSql(sql) { Bp.state.sql = sql; Bp.dot("sql", "cyan"); Bp.expand(); Bp.show("sql"); },

  setError(err) {
    Bp.state.error = err;
    Bp.dot("error", "red");
    Bp.expand();
    Bp.show("error");
  },

  render() {
    const body = U.$("#bpBody");
    body.innerHTML = "";
    const t = Bp.state.active;
    if (t === "result") Bp.renderResult(body);
    else if (t === "chart") Bp.renderChart(body);
    else if (t === "json") Bp.renderJson(body);
    else if (t === "sql") Bp.renderSql(body);
    else if (t === "error") Bp.renderError(body);
  },

  /* ---------- Результат: таблица ---------- */
  renderResult(body) {
    const res = Bp.state.result, ctx = Bp.state.ctx;
    if (!res) { body.append(U.el("div", { class: "bp-empty" }, "Выполните запрос — результат появится здесь")); return; }
    const rows = res.data || [];

    const meta = U.el("div", { class: "bp-meta" });
    if (ctx && ctx.mode) meta.append(U.el("span", { class: `mode-pill m-${ctx.mode}`, style: "font-size:10px;padding:1px 9px" }, ctx.mode.toUpperCase()));
    meta.append(U.el("span", null, `строк: ${rows.length}`));
    if (res.limit != null) meta.append(U.el("span", { class: "mono" }, `limit ${res.limit}, offset ${res.offset ?? 0}`));
    if (ctx && ctx.onPage) {
      meta.append(U.el("span", { style: "flex:1" }));
      const page = Math.floor((res.offset || 0) / (res.limit || 100)) + 1;
      meta.append(U.el("div", { class: "pager" },
        U.el("button", { class: "small", disabled: !(res.offset > 0), onclick: () => ctx.onPage(-1) }, "← Назад"),
        U.el("span", { class: "pg-info" }, `стр. ${page}`),
        U.el("button", { class: "small", disabled: !res.has_next_page, onclick: () => ctx.onPage(1) }, "Вперёд →"),
        res.has_next_page ? U.el("span", { class: "pg-info" }, "есть ещё") : null));
    }
    body.append(meta);

    if (!rows.length) {
      body.append(U.el("div", { class: "bp-empty" }, "Пустой результат: под условия не попало ни одной строки"));
      return;
    }
    body.append(Bp.table(rows));
  },

  table(rows) {
    const cols = Object.keys(rows[0]);
    const isNum = {};
    for (const c of cols) {
      isNum[c] = rows.every((r) => r[c] == null || typeof r[c] === "number");
    }
    const fmtCell = (v, c) => {
      if (v == null) return U.el("span", { class: "null" }, "null");
      if (Array.isArray(v)) return U.el("span", { class: "mono", style: "color:var(--purple)" }, `['${v.join("', '")}']`);
      if (typeof v === "number") return U.fmtNum(v);
      if (typeof v === "boolean") return U.el("span", { class: "mono", style: "color:var(--green)" }, String(v));
      return String(v);
    };
    return U.el("table", { class: "dt" },
      U.el("thead", null, U.el("tr", null, ...cols.map((c) => U.el("th", { class: isNum[c] ? "num" : "" }, c)))),
      U.el("tbody", null, ...rows.map((r) => U.el("tr", null,
        ...cols.map((c) => U.el("td", { class: isNum[c] ? "num" : (typeof r[c] === "string" && r[c].length > 24 ? "" : "mono") }, fmtCell(r[c], c)))))));
  },

  /* ---------- График (SVG line chart) ---------- */
  chartMetric: null,
  renderChart(body) {
    const res = Bp.state.result, ctx = Bp.state.ctx;
    if (!res || !ctx || ctx.mode !== "history" || !(res.data || []).length) {
      body.append(U.el("div", { class: "bp-empty" },
        "График доступен для исторических запросов (time_dimensions + метрики)"));
      return;
    }
    const tdName = ctx.tdName, metrics = ctx.metrics || [], dims = ctx.dims || [];
    if (!Bp.chartMetric || !metrics.includes(Bp.chartMetric)) Bp.chartMetric = metrics[0];

    const controls = U.el("div", { class: "chart-controls" },
      U.el("span", { class: "field-label" }, "Метрика:"),
      U.el("div", { class: "seg" }, ...metrics.map((m) => U.el("button", {
        class: m === Bp.chartMetric ? "on seg-accent" : "",
        onclick: () => { Bp.chartMetric = m; Bp.render(); }
      }, m))));
    body.append(controls);

    // серии
    const rows = res.data;
    const xs = [...new Set(rows.map((r) => r[tdName]))].sort();
    const seriesMap = new Map();
    for (const r of rows) {
      const key = dims.length ? dims.map((d) => r[d] ?? "null").join(" · ") : Bp.chartMetric;
      if (!seriesMap.has(key)) seriesMap.set(key, new Map());
      seriesMap.get(key).set(r[tdName], r[Bp.chartMetric]);
    }
    // Цвета берём из темы: при переключении светлая/тёмная график
    // перерисовывается теми же переменными, что и остальной интерфейс.
    const themed = getComputedStyle(document.documentElement);
    const palette = [1, 2, 3, 4, 5, 6, 7, 8]
      .map((i) => themed.getPropertyValue("--chart-" + i).trim())
      .filter(Boolean);
    const series = [...seriesMap.entries()].slice(0, 8).map(([name, map], i) => ({
      name, color: palette[i % palette.length],
      points: xs.map((x) => map.has(x) ? map.get(x) : null)
    }));

    const legend = U.el("div", { class: "chart-legend" },
      ...series.map((s) => U.el("span", { class: "lg-item" },
        U.el("span", { class: "lg-swatch", style: `background:${s.color}` }), s.name)));
    body.append(legend);

    const wrap = U.el("div", { class: "chart-wrap" });
    body.append(wrap);
    Bp.drawChart(wrap, xs, series);
  },

  drawChart(wrap, xs, series) {
    const W = Math.max(420, wrap.clientWidth - 4);
    const H = Math.max(160, (U.$("#bpBody").clientHeight || 260) - (series.length > 4 ? 110 : 92));
    const M = { l: 58, r: 16, t: 12, b: 26 };
    const vals = series.flatMap((s) => s.points).filter((v) => v != null);
    if (!vals.length) { wrap.append(U.el("div", { class: "bp-empty" }, "Нет числовых значений")); return; }
    let ymin = Math.min(...vals), ymax = Math.max(...vals);
    if (ymin === ymax) { ymin -= 1; ymax += 1; }
    const pad = (ymax - ymin) * 0.08;
    ymin -= pad; ymax += pad;
    if (ymin > 0 && ymin < (ymax - ymin)) ymin = 0;

    const px = (i) => M.l + (xs.length === 1 ? 0.5 : i / (xs.length - 1)) * (W - M.l - M.r);
    const py = (v) => M.t + (1 - (v - ymin) / (ymax - ymin)) * (H - M.t - M.b);

    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "linechart");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    const add = (tag, attrs, text) => {
      const n = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      if (text != null) n.textContent = text;
      svg.append(n); return n;
    };

    // сетка Y
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = ymin + (i / ticks) * (ymax - ymin);
      const y = py(v);
      add("line", { x1: M.l, x2: W - M.r, y1: y, y2: y, class: "gridline" });
      add("text", { x: M.l - 8, y: y + 3, "text-anchor": "end" }, U.fmtNum(Math.round(v * 10) / 10));
    }
    // подписи X
    const xstep = Math.max(1, Math.ceil(xs.length / Math.floor((W - M.l - M.r) / 86)));
    xs.forEach((x, i) => {
      if (i % xstep !== 0 && i !== xs.length - 1) return;
      add("text", { x: px(i), y: H - 8, "text-anchor": "middle" }, x);
    });
    add("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, class: "axis" });

    // линии серий
    for (const s of series) {
      let d = "", started = false;
      s.points.forEach((v, i) => {
        if (v == null) { started = false; return; }
        d += (started ? " L " : " M ") + px(i).toFixed(1) + " " + py(v).toFixed(1);
        started = true;
      });
      if (d) add("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" });
      s.points.forEach((v, i) => {
        if (v == null) return;
        add("circle", { cx: px(i), cy: py(v), r: 2.5, fill: s.color });
      });
    }

    // tooltip
    const guide = add("line", { x1: 0, x2: 0, y1: M.t, y2: H - M.b, stroke: "var(--border-strong)", "stroke-dasharray": "3,3", visibility: "hidden" });
    const tip = U.el("div", { class: "chart-tip" });
    document.body.append(tip);
    svg.addEventListener("mousemove", (e) => {
      const rect = svg.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      let best = 0, bd = Infinity;
      xs.forEach((x, i) => { const d = Math.abs(px(i) - mx); if (d < bd) { bd = d; best = i; } });
      guide.setAttribute("x1", px(best)); guide.setAttribute("x2", px(best));
      guide.setAttribute("visibility", "visible");
      tip.innerHTML = `<div class="tip-date">${U.esc(xs[best])}</div>` +
        series.map((s) => s.points[best] == null
          ? `<div class="tip-val" style="color:var(--faint)">${U.esc(s.name)}: null</div>`
          : `<div class="tip-val" style="color:${s.color}">${U.esc(s.name)}: <b>${U.fmtNum(s.points[best])}</b></div>`).join("");
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 280) + "px";
      tip.style.top = Math.max(8, e.clientY - 20 - series.length * 16) + "px";
    });
    svg.addEventListener("mouseleave", () => { tip.style.display = "none"; guide.setAttribute("visibility", "hidden"); });
    wrap.append(svg);
  },

  /* ---------- JSON тела ---------- */
  renderJson(body) {
    if (!Bp.state.json) { body.append(U.el("div", { class: "bp-empty" }, "Соберите запрос в конструкторе — JSON тела появится здесь")); return; }
    const text = JSON.stringify(Bp.state.json, null, 2);
    const meta = U.el("div", { class: "bp-meta" },
      U.el("span", null, "Тело POST-запроса единой ручки"),
      U.el("span", { style: "flex:1" }),
      U.el("button", { class: "small", onclick: () => U.copy(text, "JSON скопирован") }, "Копировать"));
    body.append(meta, U.el("pre", { class: "code", html: Hl.json(text) }));
  },

  /* ---------- SQL ---------- */
  renderSql(body) {
    if (!Bp.state.sql) { body.append(U.el("div", { class: "bp-empty" }, "Нажмите «Показать SQL» — итоговый SQL появится здесь")); return; }
    const meta = U.el("div", { class: "bp-meta" },
      U.el("span", null, "Итоговый SQL (query_type=raw — без выполнения)"),
      U.el("span", { style: "flex:1" }),
      U.el("button", { class: "small", onclick: () => U.copy(Bp.state.sql, "SQL скопирован") }, "Копировать"));
    body.append(meta, U.el("pre", { class: "code", html: Hl.sql(Bp.state.sql) }));
  },

  /* ---------- Ошибка ---------- */
  renderError(body) {
    const err = Bp.state.error;
    if (!err) { body.append(U.el("div", { class: "bp-empty" }, "Ошибок нет")); return; }
    const block = U.el("div", { class: "error-block" });
    if (err.chText) {
      // нативная ошибка ClickHouse (SQL-канал)
      block.append(
        U.el("div", { class: "error-head" },
          U.el("span", { class: "badge b-red mono" }, "SQL-канал"),
          U.el("span", { class: "error-msg" }, "Сервер вернул ошибку в нативном формате ClickHouse")),
        U.el("div", { class: "ch-error", html: Hl.chError(err.chText) }));
    } else {
      const human = ERROR_RU[err.code] || err.detail || "Неизвестная ошибка";
      block.append(
        U.el("div", { class: "error-head" },
          U.el("span", { class: "badge b-red mono" }, err.code || "error"),
          err.status ? U.el("span", { class: "badge mono" }, "HTTP " + err.status) : null,
          U.el("span", { class: "error-msg" }, human)),
        err.detail && err.detail !== human ? U.el("div", { style: "color:var(--muted);font-size:12px" }, err.detail) : null,
        U.el("details", { class: "error-raw" },
          U.el("summary", null, "Сырой ответ сервера"),
          U.el("pre", { class: "code framed", style: "margin-top:8px", html: Hl.json(JSON.stringify(err.raw || { code: err.code, detail: err.detail }, null, 2)) })));
    }
    body.append(block);
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { Bp });

    return U.el("tr", { class: c._kind === "param" ? "param-row" : "" },
      U.el("td", { class: "mono", style: "white-space:nowrap" },
        U.el("span", { html: CHTypes.icon(c.type), style: "margin-right:6px" }), c.column_name),

      U.el("td", { style: "white-space:nowrap" }, U.el("div", { style: "display:flex;gap:4px;flex-wrap:wrap" }, ...marks)));
  }
};
