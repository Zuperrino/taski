<script>
/* ===== src/builder.js ===== */
/* ============ Heimdall — Конструктор запросов ============ */
"use strict";

const Builder = {
  states: {}, // ключ модели → состояние конструктора

  get(model) {
    const key = ModelInfo.key(model);
    if (!Builder.states[key]) {
      const st = {
        columns: [], metrics: [],
        tdEnabled: !!model.history,
        td: null,
        filters: { type: "and", conditions: [] },
        order_by: [],
        limit: 100, offset: 0,
        limitByEnabled: false, limitBy: { limit: 1, by: [] }
      };
      if (model.history) {
        const tcol = (model.columns || []).find((c) => c.column_name === model.history.time_column) || ModelInfo.timeColumns(model)[0];
        st.td = {
          name: tcol ? tcol.column_name : model.history.time_column,
          granularity: tcol ? (tcol.default_granularity || tcol.granularities[0]) : "day",
          from: "2026-03-01", to: "2026-06-01",
          fill: model.history.fill?.mode || "previous"
        };
      }
      Builder.states[key] = st;
    }
    return Builder.states[key];
  },

  /* ---------- сборка тела запроса ---------- */
  pruneFilters(node) {
    if (!node) return null;
    if (node.type === "and" || node.type === "or") {
      const kids = (node.conditions || []).map(Builder.pruneFilters).filter(Boolean);
      if (!kids.length) return null;
      return { type: node.type, conditions: kids };
    }
    if (node.type === "not") {
      const kid = Builder.pruneFilters(node.condition);
      return kid ? { type: "not", condition: kid } : null;
    }
    if (!node.column) return null;
    const out = { type: node.type, column: node.column, operator: node.operator };
    if (node.type === "condition") out.value = node.value;
    if (node.type === "condition_in") out.value = node.value || [];
    if (node.type === "condition_like") { out.pattern = node.pattern || ""; out.case_sensitive = !/ILIKE/i.test(node.operator); }
    if (node.type === "condition_array") out.value = node.operator === "has" ? node.value : (node.value || []);
    return out;
  },

  buildBody(model, st) {
    const body = {};
    if (st.columns.length) body.columns = [...st.columns];
    if (st.metrics.length) body.metrics = [...st.metrics];
    if (model.history && st.tdEnabled && st.td) {
      body.time_dimensions = [{
        name: st.td.name, granularity: st.td.granularity,
        range: { type: "absolute", from: st.td.from, to: st.td.to },
        fill: { mode: st.td.fill }
      }];
    }
    const f = Builder.pruneFilters(st.filters);
    if (f) body.filters = f;
    const obs = st.order_by.filter((o) => o.field);
    if (obs.length) body.order_by = obs.map((o) => {
      const kind = ModelInfo.metric(model, o.field) ? "metric"
        : (st.td && o.field === st.td.name && st.tdEnabled ? "time_dimension" : "column");
      const out = { field: o.field, kind, direction: o.direction || "asc" };
      if (o.nulls) out.nulls = o.nulls;
      return out;
    });
    body.limit = U.clamp(+st.limit || 100, 1, 1000);
    if (+st.offset > 0) body.offset = +st.offset;
    if (st.limitByEnabled && st.limitBy.by.length && !(model.history && st.tdEnabled)) {
      body.limit_by = { limit: U.clamp(+st.limitBy.limit || 1, 1, 1000), by: [...st.limitBy.by] };
    }
    return body;
  },

  /* ---------- pre-flight подсказки ---------- */
  preflight(model, st, body) {
    const out = [];
    const mode = QueryLogic.mode(body);
    if (mode === "history" && !(body.metrics || []).length)
      out.push(["err", "История требует метрики: выберите хотя бы одну метрику или отключите временное измерение."]);
    if (mode === "rows" && !(body.columns || []).length)
      out.push(["err", "Пустой запрос: выберите колонки (режим строк) или метрики (агрегация)."]);
    if (mode === "rows")
      for (const o of body.order_by || [])
        if (o.kind === "metric") out.push(["err", `Сортировка по метрике «${o.field}» недоступна в режиме строк — сервер вернёт 422.`]);
    for (const c of st.columns) {
      const cc = ModelInfo.column(model, c);
      if (cc && cc._kind === "param") out.push(["warn", `Колонка «${c}» параметризована — запрос вернёт 422 param-virtual-not-supported.`]);
    }
    for (const m of st.metrics) {
      const mm = ModelInfo.metric(model, m);
      if (mm && mm._kind === "param") out.push(["warn", `Метрика «${m}» параметризована — запрос вернёт 422 param-metric-not-supported.`]);
    }
    if (mode === "history" && st.td) {
      if (!st.td.from || !st.td.to) out.push(["err", "Укажите период from/to — сервер вернёт 422 missing-time-range."]);
      const lookback = Dates.parseLookback(model.history?.lookback_safety?.default_lookback || "100y");
      if (st.td.from && st.td.to && Dates.spanYears(st.td.from, st.td.to) > lookback)
        out.push(["warn", `Период шире глубины истории (${model.history.lookback_safety.default_lookback}) — сервер вернёт 422.`]);
    }
    return out;
  },

  /* ---------- рендер ---------- */
  render(model) {
    const page = U.$("#page-builder");
    page.innerHTML = "";
    if (!model) {
      page.append(U.el("div", { class: "page-placeholder" },
        U.el("div", { class: "ph-inner" },
          U.el("div", { class: "ph-icon" }, "⚙"),
          U.el("div", { style: "font-size:14px;margin-bottom:4px" }, "Выберите модель в каталоге"),
          U.el("div", { style: "font-size:12px" }, "Конструктор собирает JSON-тело единой ручки POST /api/v1/{schema}/{model}/ без SQL."))));
      return;
    }
    const st = Builder.get(model);
    const scroll = U.el("div", { class: "page-scroll" });
    const grid = U.el("div", { class: "builder-grid" });
    scroll.append(grid);
    page.append(scroll);

    /* — индикатор режима — */
    Builder.elBanner = U.el("div", { class: "mode-banner" });
    Builder.elPreflight = U.el("div", { class: "preflight" });
    grid.append(Builder.elBanner, Builder.elPreflight);

    /* — выбор полей — */
    const pickers = U.el("div", { class: "picker-cols" });
    pickers.append(
      Builder.picker(model, st, "columns", "Колонки",
        ModelInfo.allColumns(model).map((c) => ({
          name: c.column_name, desc: c.description || "", icon: CHTypes.icon(c.type),
          param: c._kind === "param", virtual: c._kind === "virtual"
        })), "колонки не выбраны"),
      Builder.picker(model, st, "metrics", "Метрики",
        ModelInfo.allMetrics(model).map((x) => ({
          name: x.metric_name, desc: x.verbose_name || "", icon: '<span class="ticon t-metric">Σ</span>',
          param: x._kind === "param"
        })), "метрики не выбраны"));
    grid.append(pickers);

    /* — временное измерение — */
    if (model.history) grid.append(Builder.timeDimension(model, st));

    /* — фильтры — */
    const fcard = U.el("div", { class: "card" },
      U.el("div", { class: "card-head" },
        U.el("span", { class: "card-title" }, "Фильтры"),
        U.el("span", { class: "card-sub" }, "дерево условий: AND / OR / NOT с вложенностью")));
    Builder.elFilters = U.el("div", { class: "card-body padded" });
    fcard.append(Builder.elFilters);
    grid.append(fcard);
    Builder.renderFilters(model, st);

    /* — сортировка и лимиты — */
    grid.append(Builder.sortAndLimits(model, st));

    /* — действия — */
    grid.append(U.el("div", { class: "actions-bar" },
      U.el("button", { class: "primary", onclick: () => Builder.run(model) }, "Выполнить ▶"),
      U.el("button", { onclick: () => Builder.showSql(model) }, "Показать SQL"),
      U.el("button", {
        onclick: () => U.copy(QueryLogic.curl(App.settings.baseUrl, App.settings.token, model, Builder.buildBody(model, Builder.get(model))), "curl скопирован")
      }, "Копировать curl"),
      U.el("button", {
        onclick: () => U.copy(JSON.stringify(Builder.buildBody(model, Builder.get(model)), null, 2), "JSON скопирован")
      }, "Копировать JSON")));

    Builder.sync(model);
  },

  /* живое обновление баннера режима + JSON-превью */
  sync(model) {
    const st = Builder.get(model);
    const body = Builder.buildBody(model, st);
    const mode = QueryLogic.mode(body);
    const explain = {
      rows: "плоские строки: проекция columns без агрегации; сортировка по метрикам запрещена",
      aggregate: "metrics заданы → агрегация с GROUP BY по выбранным колонкам",
      history: "time_dimensions задано → срезы состояния по шагу времени, обязательны метрики"
    }[mode];
    Builder.elBanner.innerHTML = "";
    Builder.elBanner.append(
      U.el("span", { class: "field-label", style: "font-size:11px" }, "РЕЖИМ"),
      U.el("span", { class: `mode-pill m-${mode}` }, mode.toUpperCase()),
      U.el("span", { class: "mode-explain" }, explain));
    Builder.elPreflight.innerHTML = "";
    for (const [kind, msg] of Builder.preflight(model, st, body)) {
      Builder.elPreflight.append(U.el("div", { class: `preflight-item ${kind}` },
        U.el("span", null, kind === "err" ? "✕" : "⚠"), U.el("span", null, msg)));
    }
    Bp.setJson(body);
  },

  /* ---------- мультиселект с чипсами ---------- */
  picker(model, st, field, title, items, emptyText) {
    const card = U.el("div", { class: "card picker" });
    card.append(U.el("div", { class: "card-head" },
      U.el("span", { class: "card-title" }, title),
      U.el("span", { class: "card-sub" }, `${items.length} доступно`)));

    const chips = U.el("div", { class: "chips", "data-empty": emptyText });
    const warn = U.el("div", { class: "warn-inline", style: "display:none" });
    const search = U.el("input", { type: "text", placeholder: "Поиск…" });
    const list = U.el("div", { class: "picker-list" });

    const refresh = () => {
      // чипсы
      chips.innerHTML = "";
      for (const name of st[field]) {
        const item = items.find((i) => i.name === name);
        const cls = ["chip"];
        if (field === "metrics") cls.push("c-metric");
        if (item && item.param) cls.push("c-param", "c-warn");
        chips.append(U.el("span", { class: cls.join(" ") }, name,
          U.el("span", {
            class: "chip-x", title: "убрать",
            onclick: () => { st[field] = st[field].filter((x) => x !== name); refresh(); Builder.sync(model); }
          }, "×")));
      }
      // предупреждение о param
      const hasParam = st[field].some((n) => items.find((i) => i.name === n && i.param));
      warn.style.display = hasParam ? "" : "none";
      warn.textContent = "⚠ Выбраны параметризованные элементы — сервер вернёт 422 (не реализовано в REST). Оставлено для демонстрации ошибки.";
      // список
      const q = search.value.trim().toLowerCase();
      list.innerHTML = "";
      for (const it of items) {
        if (q && !(it.name + " " + it.desc).toLowerCase().includes(q)) continue;
        const on = st[field].includes(it.name);
        list.append(U.el("div", {
          class: "picker-item" + (on ? " selected" : "") + (it.param ? " param" : ""),
          onclick: () => {
            st[field] = on ? st[field].filter((x) => x !== it.name) : [...st[field], it.name];
            refresh(); Builder.sync(model);
          }
        },
          U.el("span", { class: "pi-check" }, on ? "✓" : ""),
          U.el("span", { html: it.icon }),
          U.el("span", { class: "pi-name" }, it.name),
          it.param ? U.el("span", { class: "minibadge m-param" }, "⚙ 422") : null,
          it.virtual ? U.el("span", { class: "minibadge m-virtual" }, "ƒ") : null,
          U.el("span", { class: "pi-desc" }, it.desc)));
      }
      if (!list.children.length) list.append(U.el("div", { class: "bp-empty", style: "padding:12px" }, "ничего не найдено"));
    };
    search.addEventListener("input", refresh);
    card.append(chips, warn, U.el("div", { class: "picker-search searchbox" }, search), list);
    refresh();
    return card;
  },

  /* ---------- временное измерение ---------- */
  timeDimension(model, st) {
    const card = U.el("div", { class: "card" });
    const toggle = U.el("input", { type: "checkbox" });
    toggle.checked = st.tdEnabled;
    toggle.addEventListener("change", () => {
      st.tdEnabled = toggle.checked;
      body.style.display = st.tdEnabled ? "" : "none";
      Builder.sync(model);
    });
    card.append(U.el("div", { class: "card-head" },
      U.el("label", { class: "checkline" }, toggle, U.el("span", { class: "card-title" }, "⏱ Временное измерение")),
      U.el("span", { class: "card-sub" }, "только для history-моделей; включает режим HISTORY")));

    const tcols = ModelInfo.timeColumns(model);
    const colSel = U.el("select", { class: "mono" }, ...tcols.map((c) =>
      U.el("option", { value: c.column_name, selected: c.column_name === st.td.name }, c.column_name)));
    const granSel = U.el("select", { class: "mono" });
    const fillGran = () => {
      const col = tcols.find((c) => c.column_name === colSel.value) || tcols[0];
      granSel.innerHTML = "";
      for (const g of col.granularities) {
        granSel.append(U.el("option", { value: g, selected: g === st.td.granularity }, `${g} — ${GRAN.labels[g] || g}`));
      }
      if (![...granSel.options].some((o) => o.selected)) granSel.value = col.default_granularity || col.granularities[0];
    };
    fillGran();
    colSel.addEventListener("change", () => {
      st.td.name = colSel.value;
      const col = tcols.find((c) => c.column_name === colSel.value);
      st.td.granularity = col.default_granularity || col.granularities[0];
      fillGran(); Builder.sync(model);
    });
    granSel.addEventListener("change", () => { st.td.granularity = granSel.value; Builder.sync(model); });

    const fromIn = U.el("input", { type: "date", value: st.td.from });
    const toIn = U.el("input", { type: "date", value: st.td.to });
    fromIn.addEventListener("change", () => { st.td.from = fromIn.value; Builder.sync(model); });
    toIn.addEventListener("change", () => { st.td.to = toIn.value; Builder.sync(model); });

    const fillSegBtns = {};
    const fillSeg = U.el("div", { class: "seg" }, ...["previous", "none"].map((mm) => {
      const b = U.el("button", {
        class: st.td.fill === mm ? "on seg-accent" : "",
        onclick: () => { st.td.fill = mm; Object.entries(fillSegBtns).forEach(([k, bb]) => bb.className = k === st.td.fill ? "on seg-accent" : ""); Builder.sync(model); }
      }, mm);
      fillSegBtns[mm] = b; return b;
    }));

    const body = U.el("div", { class: "td-grid" },
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Time-колонка"), colSel),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Шаг времени"), granSel),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "From (включительно)"), fromIn),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "To"), toIn,
        U.el("span", { class: "field-hint" }, "to — не включительно")),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Fill (пропуски)"), fillSeg,
        U.el("span", { class: "field-hint" }, "previous — последнее известное значение")));
    body.style.display = st.tdEnabled ? "" : "none";
    card.append(body);
    return card;
  },

  /* ---------- дерево фильтров ---------- */
  filterableColumns(model) {
    return ModelInfo.allColumns(model).filter((c) => c._kind !== "param");
  },

  newCondition(model) {
    const col = Builder.filterableColumns(model)[0];
    return Builder.condFor(model, col ? col.column_name : "", "=");
  },

  condFor(model, column, operator) {
    const node = { column, operator };
    if (operator === "IN" || operator === "NOT IN") { node.type = "condition_in"; node.value = []; }
    else if (/LIKE/i.test(operator)) { node.type = "condition_like"; node.pattern = ""; }
    else if (/NULL/i.test(operator)) { node.type = "condition_null"; }
    else if (operator === "has") { node.type = "condition_array"; node.value = ""; }
    else if (operator === "hasAny" || operator === "hasAll") { node.type = "condition_array"; node.value = []; }
    else { node.type = "condition"; node.value = ""; }
    return node;
  },

  opsFor(model, colName) {
    const col = ModelInfo.column(model, colName);
    const t = CHTypes.parse(col ? col.type : "String");
    if (t.base === "array") return ["has", "hasAny", "hasAll"];
    if (t.base === "bool") return ["=", "!=", "IS NULL", "IS NOT NULL"];
    const base = ["=", "!=", ">", "<", ">=", "<=", "IN", "NOT IN"];
    if (t.base === "string" || t.base === "uuid") base.push("LIKE", "NOT LIKE", "ILIKE", "NOT ILIKE");
    base.push("IS NULL", "IS NOT NULL");
    return base;
  },

  renderFilters(model, st) {
    Builder.elFilters.innerHTML = "";
    Builder.elFilters.append(Builder.filterGroup(model, st, st.filters, null));
  },

  filterGroup(model, st, node, parentRemove) {
    const isNot = node.type === "not";
    const cls = node.type === "and" ? "f-and" : node.type === "or" ? "f-or" : "f-not";
    const wrap = U.el("div", { class: `fgroup ${cls}` });

    const head = U.el("div", { class: "fgroup-head" });
    if (isNot) {
      head.append(U.el("span", { class: "badge b-red mono" }, "NOT"));
    } else {
      const segBtns = {};
      head.append(U.el("div", { class: "seg" }, ...["and", "or"].map((tt) => {
        const b = U.el("button", {
          class: node.type === tt ? "on seg-accent" : "",
          onclick: () => { node.type = tt; Builder.renderFilters(model, st); Builder.sync(model); }
        }, tt.toUpperCase());
        segBtns[tt] = b; return b;
      })));
    }
    head.append(U.el("span", { style: "flex:1" }));
    if (!isNot) {
      head.append(
        U.el("button", { class: "ghost small", onclick: () => { node.conditions.push(Builder.newCondition(model)); Builder.renderFilters(model, st); Builder.sync(model); } }, "+ условие"),
        U.el("button", { class: "ghost small", onclick: () => { node.conditions.push({ type: "and", conditions: [Builder.newCondition(model)] }); Builder.renderFilters(model, st); Builder.sync(model); } }, "+ группа"),
        U.el("button", { class: "ghost small", onclick: () => { node.conditions.push({ type: "not", condition: Builder.newCondition(model) }); Builder.renderFilters(model, st); Builder.sync(model); } }, "+ NOT"));
    }
    if (parentRemove) head.append(U.el("button", { class: "danger-ghost small", title: "удалить", onclick: parentRemove }, "✕"));
    wrap.append(head);

    const bodyEl = U.el("div", { class: "fgroup-body" });
    if (isNot) {
      const kid = node.condition;
      if (kid) bodyEl.append(Builder.filterChild(model, st, kid,
        () => { node.condition = null; Builder.renderFilters(model, st); Builder.sync(model); }));
      else bodyEl.append(U.el("div", { class: "filters-empty" },
        U.el("button", { class: "ghost small", onclick: () => { node.condition = Builder.newCondition(model); Builder.renderFilters(model, st); Builder.sync(model); } }, "+ условие внутрь NOT")));
    } else {
      const kids = node.conditions || [];
      if (!kids.length) bodyEl.append(U.el("div", { class: "filters-empty" }, "Условий нет — фильтр не отправляется. Добавьте «+ условие» или «+ группа»."));
      kids.forEach((kid, i) => {
        if (i > 0) bodyEl.append(U.el("div", { class: "fjoin-label" }, node.type.toUpperCase()));
        bodyEl.append(Builder.filterChild(model, st, kid,
          () => { node.conditions.splice(i, 1); Builder.renderFilters(model, st); Builder.sync(model); }));
      });
    }
    wrap.append(bodyEl);
    return wrap;
  },

  filterChild(model, st, node, remove) {
    if (node.type === "and" || node.type === "or" || node.type === "not")
      return Builder.filterGroup(model, st, node, remove);
    return Builder.filterLeaf(model, st, node, remove);
  },

  filterLeaf(model, st, node, remove) {
    const row = U.el("div", { class: "fcond" });
    const cols = Builder.filterableColumns(model);
    const colSel = U.el("select", { class: "f-col" }, ...cols.map((c) =>
      U.el("option", { value: c.column_name, selected: c.column_name === node.column }, c.column_name)));
    const opSel = U.el("select", { class: "f-op" });
    const valWrap = U.el("span", { style: "display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap" });

    const fillOps = () => {
      const ops = Builder.opsFor(model, colSel.value);
      opSel.innerHTML = "";
      for (const op of ops) opSel.append(U.el("option", { value: op, selected: op === node.operator }, op));
      if (!ops.includes(node.operator)) {
        const fresh = Builder.condFor(model, colSel.value, ops[0]);
        Object.keys(node).forEach((k) => delete node[k]);
        Object.assign(node, fresh);
        opSel.value = node.operator;
      }
    };

    const renderValue = () => {
      valWrap.innerHTML = "";
      const col = ModelInfo.column(model, node.column);
      const t = CHTypes.parse(col ? col.type : "String");
      if (node.type === "condition_null") return;
      if (node.type === "condition_in" || (node.type === "condition_array" && node.operator !== "has")) {
        valWrap.append(Builder.tagInput(node.value || [], (vals) => { node.value = vals; Builder.sync(model); },
          t.base === "array" ? "элемент массива + Enter" : "значение + Enter"));
        return;
      }
      if (node.type === "condition_like") {
        const inp = U.el("input", { type: "text", class: "mono", placeholder: "шаблон, напр. %lead%", value: node.pattern || "" });
        inp.addEventListener("input", () => { node.pattern = inp.value; Builder.sync(model); });
        valWrap.append(inp);
        return;
      }
      // скаляр
      const base = node.type === "condition_array" ? (t.elem ? t.elem.base : "string") : t.base;
      if (base === "bool") {
        const sel = U.el("select", null,
          U.el("option", { value: "true", selected: node.value === true }, "true"),
          U.el("option", { value: "false", selected: node.value === false }, "false"));
        sel.addEventListener("change", () => { node.value = sel.value === "true"; Builder.sync(model); });
        if (node.value === "" || node.value == null) node.value = sel.value === "true";
        valWrap.append(sel);
      } else if (base === "number") {
        const inp = U.el("input", { type: "number", class: "mono", style: "width:110px", value: node.value ?? "" });
        inp.addEventListener("input", () => { node.value = inp.value === "" ? "" : +inp.value; Builder.sync(model); });
        valWrap.append(inp);
      } else if (base === "date" || base === "datetime") {
        const inp = U.el("input", { type: "date", value: node.value || "" });
        inp.addEventListener("change", () => { node.value = inp.value; Builder.sync(model); });
        valWrap.append(inp);
      } else {
        const inp = U.el("input", { type: "text", class: "mono", placeholder: "значение", value: node.value ?? "" });
        inp.addEventListener("input", () => { node.value = inp.value; Builder.sync(model); });
        valWrap.append(inp);
      }
    };

    colSel.addEventListener("change", () => {
      const fresh = Builder.condFor(model, colSel.value, Builder.opsFor(model, colSel.value)[0]);
      Object.keys(node).forEach((k) => delete node[k]);
      Object.assign(node, fresh);
      fillOps(); renderValue(); Builder.sync(model);
    });
    opSel.addEventListener("change", () => {
      const keepCol = node.column;
      const fresh = Builder.condFor(model, keepCol, opSel.value);
      Object.keys(node).forEach((k) => delete node[k]);
      Object.assign(node, fresh);
      renderValue(); Builder.sync(model);
    });

    fillOps(); renderValue();
    row.append(colSel, opSel, valWrap, U.el("span", { style: "flex:1" }),
      U.el("button", { class: "danger-ghost small", title: "удалить условие", onclick: remove }, "✕"));
    return row;
  },

  tagInput(values, onChange, placeholder) {
    const wrap = U.el("span", { class: "taginput" });
    const input = U.el("input", { type: "text", class: "mono", placeholder: placeholder || "значение + Enter" });
    const refresh = () => {
      U.$$(".chip", wrap).forEach((c) => c.remove());
      values.slice().reverse().forEach((v) => {
        wrap.prepend(U.el("span", { class: "chip" }, String(v),
          U.el("span", {
            class: "chip-x",
            onclick: () => { const i = values.indexOf(v); if (i >= 0) values.splice(i, 1); refresh(); onChange(values); }
          }, "×")));
      });
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim()) {
        e.preventDefault();
        const v = input.value.trim();
        values.push(/^-?\d+(\.\d+)?$/.test(v) ? +v : v);
        input.value = "";
        refresh(); onChange(values);
      } else if (e.key === "Backspace" && !input.value && values.length) {
        values.pop(); refresh(); onChange(values);
      }
    });
    wrap.append(input);
    refresh();
    return wrap;
  },

  /* ---------- сортировка и лимиты ---------- */
  sortAndLimits(model, st) {
    const card = U.el("div", { class: "card" });
    card.append(U.el("div", { class: "card-head" }, U.el("span", { class: "card-title" }, "Сортировка и лимиты")));

    const sortWrap = U.el("div", { class: "sort-rows" });
    const fields = () => {
      const out = ModelInfo.allColumns(model).filter((c) => c._kind !== "param").map((c) => c.column_name);
      for (const m of model.metrics || []) out.push(m.metric_name);
      return out;
    };
    const renderSorts = () => {
      sortWrap.innerHTML = "";
      st.order_by.forEach((o, i) => {
        const fieldSel = U.el("select", { class: "mono" }, ...fields().map((f) =>
          U.el("option", { value: f, selected: f === o.field }, f)));
        fieldSel.addEventListener("change", () => { o.field = fieldSel.value; Builder.sync(model); });
        const dirSel = U.el("select", null,
          U.el("option", { value: "asc", selected: o.direction !== "desc" }, "по возрастанию"),
          U.el("option", { value: "desc", selected: o.direction === "desc" }, "по убыванию"));
        dirSel.addEventListener("change", () => { o.direction = dirSel.value; Builder.sync(model); });
        const nullsSel = U.el("select", null,
          U.el("option", { value: "" }, "nulls: по умолчанию"),
          U.el("option", { value: "first", selected: o.nulls === "first" }, "nulls first"),
          U.el("option", { value: "last", selected: o.nulls === "last" }, "nulls last"));
        nullsSel.addEventListener("change", () => { o.nulls = nullsSel.value || null; Builder.sync(model); });
        sortWrap.append(U.el("div", { class: "sort-row" },
          U.el("span", { class: "mono", style: "color:var(--faint);width:18px" }, String(i + 1) + "."),
          fieldSel, dirSel, nullsSel,
          U.el("button", { class: "danger-ghost small", onclick: () => { st.order_by.splice(i, 1); renderSorts(); Builder.sync(model); } }, "✕")));
      });
      sortWrap.append(U.el("div", null,
        U.el("button", { class: "ghost small", onclick: () => { st.order_by.push({ field: fields()[0], direction: "asc", nulls: null }); renderSorts(); Builder.sync(model); } }, "+ сортировка")));
    };
    renderSorts();
    card.append(sortWrap);

    const limitIn = U.el("input", { type: "number", min: 1, max: 1000, value: st.limit, style: "width:90px", class: "mono" });
    limitIn.addEventListener("change", () => { st.limit = U.clamp(+limitIn.value || 100, 1, 1000); limitIn.value = st.limit; Builder.sync(model); });
    const offsetIn = U.el("input", { type: "number", min: 0, value: st.offset, style: "width:90px", class: "mono" });
    offsetIn.addEventListener("change", () => { st.offset = Math.max(0, +offsetIn.value || 0); offsetIn.value = st.offset; Builder.sync(model); });
    Builder.elOffsetInput = offsetIn;

    const historyOn = () => model.history && st.tdEnabled;
    const lbToggle = U.el("input", { type: "checkbox" });
    lbToggle.checked = st.limitByEnabled;
    const lbLimit = U.el("input", { type: "number", min: 1, value: st.limitBy.limit, style: "width:70px", class: "mono" });
    lbLimit.addEventListener("change", () => { st.limitBy.limit = Math.max(1, +lbLimit.value || 1); Builder.sync(model); });
    const lbChips = U.el("div", { style: "display:flex;gap:4px;flex-wrap:wrap" });
    const renderLbChips = () => {
      lbChips.innerHTML = "";
      for (const c of (model.columns || [])) {
        const on = st.limitBy.by.includes(c.column_name);
        lbChips.append(U.el("span", {
          class: "gran-chip" + (on ? " on" : ""), style: "cursor:pointer",
          onclick: () => {
            st.limitBy.by = on ? st.limitBy.by.filter((x) => x !== c.column_name) : [...st.limitBy.by, c.column_name];
            renderLbChips(); Builder.sync(model);
          }
        }, c.column_name));
      }
    };
    renderLbChips();
    lbToggle.addEventListener("change", () => { st.limitByEnabled = lbToggle.checked; lbBody.style.display = lbToggle.checked ? "" : "none"; Builder.sync(model); });

    const lbBody = U.el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" + (st.limitByEnabled ? "" : ";display:none") },
      U.el("span", { class: "field-label" }, "LIMIT"), lbLimit, U.el("span", { class: "field-label" }, "BY"), lbChips);
    if (!st.limitByEnabled) lbBody.style.display = "none";

    const lbDisabledNote = historyOn()
      ? U.el("span", { class: "field-hint", "data-tip": "limit-by-not-supported-in-history: LIMIT BY не работает в исторических запросах" }, "⚠ недоступно в history-режиме")
      : null;
    if (historyOn()) { lbToggle.disabled = true; }

    card.append(U.el("div", { class: "limits-grid" },
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Limit (1..1000)"), limitIn),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Offset"), offsetIn),
      U.el("div", { class: "field" },
        U.el("label", { class: "checkline" }, lbToggle, U.el("span", { class: "field-label" }, "limit_by (LIMIT N BY …)"), lbDisabledNote),
        lbBody)));
    return card;
  },

  /* ---------- действия ---------- */
  async run(model) {
    const st = Builder.get(model);
    const body = Builder.buildBody(model, st);
    Bp.setJson(body);
    Bp.loading();
    try {
      const res = await Api.client().query(model.schema_name, model.logic_model, body);
      const mode = QueryLogic.mode(body);
      Bp.setResult(res, {
        mode,
        tdName: body.time_dimensions ? body.time_dimensions[0].name : null,
        metrics: body.metrics || [],
        dims: body.columns || [],
        onPage: (dir) => {
          st.offset = Math.max(0, (st.offset || 0) + dir * (body.limit || 100));
          if (Builder.elOffsetInput) Builder.elOffsetInput.value = st.offset;
          Builder.run(model);
        }
      });
    } catch (e) {
      Bp.setError(e instanceof ApiError ? e : new ApiError(0, "network", ERROR_RU.network, { error: String(e) }));
    }
  },

  async showSql(model) {
    const st = Builder.get(model);
    const body = Builder.buildBody(model, st);
    Bp.setJson(body);
    try {
      const res = await Api.client().query(model.schema_name, model.logic_model, body, { raw: true });
      Bp.setSql(res.raw_sql || "-- сервер не вернул raw_sql");
    } catch (e) {
      Bp.setError(e instanceof ApiError ? e : new ApiError(0, "network", ERROR_RU.network, { error: String(e) }));
    }
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { Builder });

</script>
<script>
/* ===== src/sqlconsole.js ===== */
/* ============ Heimdall — SQL-консоль ============ */
"use strict";

const SqlConsole = {
  /* примеры строятся по загруженному каталогу; пока каталога нет — нейтральные шаблоны */
  examples() {
    const key = (m) => `${m.schema_name}.${m.logic_model}`;
    const firstMetric = (m) => ((m.metrics || [])[0] || {}).metric_name;
    const firstDim = (m) => (((m.columns || []).find((c) => CHTypes.parse(c.type).base === "string")) || {}).column_name;
    const hist = App.catalog.find((m) => m.history && (m.metrics || []).length);
    const plain = App.catalog.find((m) => !m.history && (m.columns || []).length);
    const now = new Date();
    const monthEnd = Dates.iso(Dates.lastOfMonth(Dates.addMonths(now, -1)));
    const yearStart = `${now.getFullYear()}-01-01`;
    const today = Dates.iso(now);
    const out = [];
    if (hist) {
      const tcol = (ModelInfo.timeColumns(hist)[0] || {}).column_name || "report_date";
      const met = firstMetric(hist) || "count";
      const dim = firstDim(hist);
      const dimSel = dim ? `${dim}, ` : "";
      out.push({
        title: "Точечный срез истории",
        desc: `состояние на дату: ${tcol} = …`,
        sql: `SELECT ${dimSel}${met}()\nFROM ${key(hist)}\nWHERE ${tcol} = '${monthEnd}'${dim ? `\nGROUP BY ${dim}` : ""}`
      });
      out.push({
        title: "Динамика по месяцам",
        desc: "шаг задаётся функцией toLastDayOfMonth",
        sql: `SELECT\n    toLastDayOfMonth(${tcol}) AS month_end,\n    ${dimSel}${met}()\nFROM ${key(hist)}\nWHERE ${tcol} >= '${yearStart}'\n  AND ${tcol} < '${today}'\nGROUP BY month_end${dim ? `, ${dim}` : ""}\nORDER BY month_end`
      });
    }
    if (plain) {
      const met = firstMetric(plain);
      const dim = firstDim(plain);
      if (met && dim) out.push({
        title: "Агрегация",
        desc: "метрики как функции на обычной модели",
        sql: `SELECT ${dim}, ${met}()\nFROM ${key(plain)}\nGROUP BY ${dim}\nORDER BY ${dim}`
      });
      const cols = (plain.columns || []).slice(0, 3).map((c) => c.column_name);
      if (cols.length) out.push({
        title: "Плоские строки",
        desc: "выборка колонок с лимитом",
        sql: `SELECT ${cols.join(", ")}\nFROM ${key(plain)}\nLIMIT 20`
      });
      const arrCol = (plain.columns || []).find((c) => CHTypes.parse(c.type).base === "array");
      if (arrCol) out.push({
        title: "Фильтр по массиву",
        desc: `notEmpty по ${arrCol.type}`,
        sql: `SELECT ${dim || cols[0]}, ${arrCol.column_name}\nFROM ${key(plain)}\nWHERE notEmpty(${arrCol.column_name})\nLIMIT 20`
      });
    }
    const anyM = hist || plain || App.catalog[0];
    out.push({
      title: "DESCRIBE модели",
      desc: "колонки, типы, метрики",
      sql: `DESCRIBE ${anyM ? key(anyM) : "schema.logic_model"}`
    });
    return out;
  },

  sideTab: "insert",

  init() {
    const page = U.$("#page-sql");
    page.innerHTML = "";
    const layout = U.el("div", { class: "sql-layout" });

    /* — главная колонка — */
    const main = U.el("div", { class: "sql-main" });
    const toolbar = U.el("div", { class: "actions-bar" },
      U.el("button", { class: "primary", onclick: () => SqlConsole.run(false) }, "Выполнить ▶"),
      U.el("button", { onclick: () => SqlConsole.run(true), title: "добавляет /*raw*/ — сервер вернёт итоговый SQL без выполнения" }, "Превью SQL"),
      U.el("span", { style: "flex:1" }),
      U.el("span", { class: "field-hint" }, "POST / (text/plain) · таблицы по логическим именам · метрики как функции: headcount()"));

    const editor = U.el("textarea", { class: "sql-editor", spellcheck: "false", placeholder: "SELECT column, metric()\nFROM schema.logic_model\nWHERE …\nGROUP BY column" });
    editor.value = localStorage.getItem("heimdall.sql") || "";
    editor.addEventListener("input", U.debounce(() => localStorage.setItem("heimdall.sql", editor.value), 300));
    editor.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); SqlConsole.run(false); }
    });
    SqlConsole.editor = editor;

    const hint = U.el("div", { class: "field-hint" },
      "Ctrl/Cmd+Enter — выполнить. На history-моделях запрещены сырые агрегаты, JOIN и ручной WITH FILL — только объявленные метрики.");

    main.append(toolbar, editor, hint);

    /* — боковая панель — */
    const side = U.el("div", { class: "sql-side" });
    const tabs = U.el("div", { class: "sql-side-tabs" },
      U.el("div", { class: "sql-side-tab" + (SqlConsole.sideTab === "insert" ? " active" : ""), dataset: { stab: "insert" }, onclick: () => SqlConsole.switchSide("insert") }, "Вставка"),
      U.el("div", { class: "sql-side-tab" + (SqlConsole.sideTab === "examples" ? " active" : ""), dataset: { stab: "examples" }, onclick: () => SqlConsole.switchSide("examples") }, "Примеры"));
    const sideBody = U.el("div", { class: "sql-side-body" });
    SqlConsole.sideBody = sideBody;
    side.append(tabs, sideBody);

    layout.append(main, side);
    page.append(layout);
    SqlConsole.renderSide();
  },

  render() { /* страница статична; обновляем только панель вставки */ },

  switchSide(tab) {
    SqlConsole.sideTab = tab;
    U.$$(".sql-side-tab").forEach((t) => t.classList.toggle("active", t.dataset.stab === tab));
    SqlConsole.renderSide();
  },

  renderSide() {
    if (SqlConsole.sideTab === "insert") SqlConsole.renderInsertPanel();
    else SqlConsole.renderExamples();
  },

  renderInsertPanel() {
    if (!SqlConsole.sideBody || SqlConsole.sideTab !== "insert") return;
    const root = SqlConsole.sideBody;
    root.innerHTML = "";
    const schemas = [...new Set(App.catalog.map((m) => m.schema_name))];
    if (!schemas.length) { root.append(U.el("div", { class: "bp-empty" }, "Каталог пуст")); return; }
    for (const schema of schemas) {
      root.append(U.el("div", { class: "ins-group-label" }, schema));
      for (const m of App.catalog.filter((x) => x.schema_name === schema)) {
        const key = `${m.schema_name}.${m.logic_model}`;
        const det = U.el("details", null,
          U.el("summary", {
            class: "ins-item", style: "list-style:none",
            ondblclick: (e) => { e.preventDefault(); }
          },
            U.el("span", { style: "color:var(--faint)" }, "▸"),
            U.el("span", {
              style: "color:var(--accent-text);cursor:pointer", title: "клик — вставить имя таблицы",
              onclick: (e) => { e.preventDefault(); e.stopPropagation(); SqlConsole.insert(key); }
            }, m.logic_model),
            U.el("span", { class: "ins-dim" }, m.history ? "⏱" : m.array_join ? "⊞" : (m.joins || []).length ? "⇄" : "")));
        const inner = U.el("div", { style: "padding-left:14px" });
        for (const c of ModelInfo.allColumns(m)) {
          inner.append(U.el("div", { class: "ins-item", title: c.description || "", onclick: () => SqlConsole.insert(c.column_name) },
            U.el("span", { html: CHTypes.icon(c.type) }), c.column_name,
            U.el("span", { class: "ins-dim" }, c._kind === "param" ? "⚙" : "")));
        }
        for (const x of ModelInfo.allMetrics(m)) {
          inner.append(U.el("div", { class: "ins-item", title: x.verbose_name || "", onclick: () => SqlConsole.insert(x.metric_name + "()") },
            U.el("span", { html: '<span class="ticon t-metric">Σ</span>' }), x.metric_name + "()",
            U.el("span", { class: "ins-dim" }, x._kind === "param" ? "⚙" : "")));
        }
        det.append(inner);
        root.append(det);
      }
    }
  },

  renderExamples() {
    if (!SqlConsole.sideBody || SqlConsole.sideTab !== "examples") return;
    const root = SqlConsole.sideBody;
    root.innerHTML = "";
    for (const ex of SqlConsole.examples()) {
      root.append(U.el("div", {
        class: "example-item",
        onclick: () => {
          SqlConsole.editor.value = ex.sql;
          localStorage.setItem("heimdall.sql", ex.sql);
          SqlConsole.editor.focus();
        }
      },
        U.el("div", { class: "ex-title" }, ex.title),
        U.el("div", { class: "ex-desc" }, ex.desc)));
    }
  },

  insert(text) {
    const ed = SqlConsole.editor;
    const start = ed.selectionStart ?? ed.value.length;
    const end = ed.selectionEnd ?? ed.value.length;
    const before = ed.value.slice(0, start), after = ed.value.slice(end);
    const sep = before && !/[\s(,.]$/.test(before) ? " " : "";
    ed.value = before + sep + text + after;
    const pos = (before + sep + text).length;
    ed.focus();
    ed.setSelectionRange(pos, pos);
    localStorage.setItem("heimdall.sql", ed.value);
  },

  async run(rawPreview) {
    let text = SqlConsole.editor.value.trim();
    if (!text) { Toast.show("Введите SQL-запрос", "err"); return; }
    /* все триггеры raw-превью канала (префикс RAW и оба коммент-триггера);
       в raw-режиме сервер не исполняет запрос — ответ всегда итоговый SQL */
    const rawTrigger = /^\s*(RAW\b|\/\*\s*raw\s*\*\/|--\s*raw)/i;
    const isRaw = rawPreview || rawTrigger.test(text);
    if (rawPreview && !rawTrigger.test(text)) text = "/*raw*/ " + text;
    Bp.loading();
    try {
      const res = await Api.client().sql(text);
      if (!res.ok) {
        Bp.setError({ chText: res.error });
        return;
      }
      if (isRaw) {
        Bp.setSql(res.text);
        return;
      }
      const rows = SqlConsole.parseTSV(res.text);
      Bp.setResult({ data: rows, limit: null, offset: null, has_next_page: false }, { mode: null });
    } catch (e) {
      if (e instanceof ApiError) Bp.setError(e);
      else Bp.setError(new ApiError(0, "network", ERROR_RU.network, { error: String(e) }));
    }
  },

  parseTSV(text) {
    const lines = String(text || "").split("\n").filter((l) => l.length);
    if (!lines.length) return [];
    const header = lines[0].split("\t");
    return lines.slice(1).map((l) => {
      const cells = l.split("\t");
      const row = {};
      header.forEach((h, i) => {
        let v = cells[i];
        if (v === "\\N" || v === undefined) v = null;
        else if (/^-?\d+(\.\d+)?$/.test(v)) v = +v;
        row[h] = v;
      });
      return row;
    });
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { SqlConsole });

</script>
<script>
/* ===== src/yamleditor.js ===== */
/* ============ Heimdall — Редактор датасета (форма → YAML) ============ */
"use strict";

const YamlEditor = {
  form: null,
  fieldRefs: {},
  previewEl: null,
  summaryEl: null,

  defaultForm() {
    return {
      logic_model: "", table_name: "", schema_name: "dm_core", description: "",
      allowed_groups: [], disallowed_groups: [], visible: [], kind: "plain",
      history: { valid_from: "_change_date", primary_key: "", time_column: "", require_time_range: true, fill_mode: "previous", lookback: "5y" },
      array_join: { type: "left", source_model: "", arrays: [{ source: "", as: "", element_type: "String" }] },
      columns: [{ column_name: "", type: "String", description: "", sql: "", granularities: "", default_granularity: "" }],
      virtual_columns: [],
      metrics: [],
      param_virtual_columns: [], param_metrics: [], joins: []
    };
  },

  modelToForm(m) {
    const f = YamlEditor.defaultForm();
    f.logic_model = m.logic_model || "";
    f.table_name = m.table_name || "";
    f.schema_name = m.schema_name || "dm_core";
    f.description = m.description || "";
    f.allowed_groups = [...(m.allowed_groups || [])];
    f.disallowed_groups = [...(m.disallowed_groups || [])];
    f.visible = [...(m.visible || [])];
    f.kind = m.history ? "history" : m.array_join ? "array_join" : "plain";
    if (m.history) {
      f.history = {
        valid_from: m.history.valid_from || "_change_date",
        primary_key: m.history.primary_key || "",
        time_column: m.history.time_column || "",
        require_time_range: m.history.require_time_range !== false,
        fill_mode: m.history.fill?.mode || "previous",
        lookback: m.history.lookback_safety?.default_lookback || "5y"
      };
    }
    if (m.array_join) {
      f.array_join = {
        type: m.array_join.type || "left",
        source_model: m.array_join.source_model || "",
        arrays: (m.array_join.arrays || []).map((a) => ({ source: a.source || "", as: a.as || "", element_type: a.element_type || "String" }))
      };
    }
    f.columns = (m.columns || []).map((c) => ({
      column_name: c.column_name || "", type: c.type || "String", description: c.description || "",
      sql: c.sql || "", granularities: (c.granularities || []).join(", "), default_granularity: c.default_granularity || ""
    }));
    if (!f.columns.length) f.columns = YamlEditor.defaultForm().columns;
    f.virtual_columns = (m.virtual_columns || []).map((c) => ({
      column_name: c.column_name || "", type: c.type || "String", description: c.description || "", sql: c.sql || ""
    }));
    f.metrics = (m.metrics || []).map((x) => ({
      metric_name: x.metric_name || "", sql: x.sql || "", verbose_name: x.verbose_name || "", description: x.description || ""
    }));
    f.param_virtual_columns = U.clone(m.param_virtual_columns || []);
    f.param_metrics = U.clone(m.param_metrics || []);
    f.joins = U.clone(m.joins || []);
    return f;
  },

  formToDataset(f) {
    const grans = (s) => String(s || "").split(",").map((x) => x.trim()).filter(Boolean);
    const ds = {
      logic_model: f.logic_model.trim(), table_name: f.table_name.trim(),
      schema_name: f.schema_name.trim() || "dm_core",
      description: f.description.trim(),
      allowed_groups: [...f.allowed_groups],
      disallowed_groups: [...(f.disallowed_groups || [])],
      visible: [...(f.visible || [])],
      history: null, array_join: null,
      columns: f.columns.filter((c) => c.column_name.trim() || c.description || c.sql).map((c) => {
        const out = { column_name: c.column_name.trim(), type: c.type.trim() || "String" };
        if (c.description) out.description = c.description;
        if (c.sql) out.sql = c.sql;
        const g = grans(c.granularities);
        if (g.length) { out.granularities = g; if (c.default_granularity) out.default_granularity = c.default_granularity.trim(); }
        return out;
      }),
      virtual_columns: f.virtual_columns.filter((c) => c.column_name.trim() || c.sql).map((c) => ({
        column_name: c.column_name.trim(), type: c.type.trim() || "String",
        ...(c.description ? { description: c.description } : {}), sql: c.sql
      })),
      param_virtual_columns: U.clone(f.param_virtual_columns || []),
      metrics: f.metrics.filter((x) => x.metric_name.trim() || x.sql).map((x) => ({
        metric_name: x.metric_name.trim(), sql: x.sql, verbose_name: x.verbose_name,
        ...(x.description ? { description: x.description } : {})
      })),
      param_metrics: U.clone(f.param_metrics || []),
      joins: U.clone(f.joins || [])
    };
    if (f.kind === "history") {
      ds.history = {
        valid_from: f.history.valid_from.trim() || "_change_date",
        primary_key: f.history.primary_key.trim(),
        time_column: f.history.time_column.trim(),
        require_time_range: !!f.history.require_time_range,
        fill: { mode: f.history.fill_mode },
        lookback_safety: { default_lookback: f.history.lookback.trim() || "5y" }
      };
    }
    if (f.kind === "array_join") {
      ds.array_join = {
        type: f.array_join.type,
        source_model: (f.array_join.source_model || "").trim(),
        arrays: f.array_join.arrays.filter((a) => a.source.trim() || a.as.trim()).map((a) => ({
          source: a.source.trim(), as: a.as.trim(), element_type: a.element_type.trim() || "String"
        }))
      };
    }
    return ds;
  },

  /* ---------- валидация ---------- */
  validate(f) {
    const errs = [];
    const E = (key, msg) => errs.push({ key, msg });
    if (!f.logic_model.trim()) E("logic_model", "logic_model обязателен");
    else if (!/^[a-z_][a-z0-9_]*$/i.test(f.logic_model.trim())) E("logic_model", "logic_model: только буквы, цифры и _");
    if (!f.table_name.trim()) E("table_name", "table_name обязателен");

    const colNames = [];
    f.columns.forEach((c, i) => {
      const name = c.column_name.trim();
      if (!name) { E(`col.${i}.column_name`, `колонка №${i + 1}: column_name обязателен`); return; }
      if (colNames.includes(name)) E(`col.${i}.column_name`, `колонка «${name}» объявлена дважды`);
      colNames.push(name);
      const g = String(c.granularities || "").split(",").map((x) => x.trim()).filter(Boolean);
      if (g.length) {
        const t = CHTypes.parse(c.type);
        if (t.base !== "date" && t.base !== "datetime")
          E(`col.${i}.granularities`, `«${name}»: granularities допустимы только на Date/DateTime`);
        const bad = g.filter((x) => !GRAN.all.includes(x));
        if (bad.length) E(`col.${i}.granularities`, `«${name}»: неизвестные гранулярности: ${bad.join(", ")}`);
        if (t.base === "date" && g.some((x) => x === "hour" || x === "minute"))
          E(`col.${i}.granularities`, `«${name}»: hour/minute допустимы только на DateTime`);
        if (c.default_granularity && !g.includes(c.default_granularity.trim()))
          E(`col.${i}.default_granularity`, `«${name}»: default_granularity должна входить в granularities`);
      } else if (c.default_granularity) {
        E(`col.${i}.default_granularity`, `«${name}»: default_granularity без granularities`);
      }
    });
    f.virtual_columns.forEach((c, i) => {
      const name = c.column_name.trim();
      if (!name) { E(`vcol.${i}.column_name`, `вирт. колонка №${i + 1}: column_name обязателен`); return; }
      if (!c.sql.trim()) E(`vcol.${i}.sql`, `вирт. колонка «${name}»: поле sql обязательно`);
      if (colNames.includes(name)) E(`vcol.${i}.column_name`, `имя «${name}» уже занято колонкой`);
      colNames.push(name);
    });

    const metNames = [];
    f.metrics.forEach((x, i) => {
      const name = x.metric_name.trim();
      if (!name) { E(`met.${i}.metric_name`, `метрика №${i + 1}: metric_name обязателен`); return; }
      if (!x.sql.trim()) E(`met.${i}.sql`, `метрика «${name}»: sql обязателен`);
      if (!x.verbose_name.trim()) E(`met.${i}.verbose_name`, `метрика «${name}»: verbose_name обязателен`);
      if (metNames.includes(name)) E(`met.${i}.metric_name`, `метрика «${name}» объявлена дважды`);
      if (colNames.includes(name)) E(`met.${i}.metric_name`, `метрика «${name}» не может называться как колонка`);
      metNames.push(name);
    });

    if (f.kind === "history") {
      const h = f.history;
      if (!h.primary_key.trim()) E("history.primary_key", "history: primary_key обязателен");
      else if (!colNames.includes(h.primary_key.trim())) E("history.primary_key", `history: primary_key «${h.primary_key}» отсутствует в columns`);
      if (!h.time_column.trim()) E("history.time_column", "history: time_column обязателен");
      else {
        const tc = f.columns.find((c) => c.column_name.trim() === h.time_column.trim());
        if (!tc) E("history.time_column", `history: time_column «${h.time_column}» отсутствует в columns`);
        else if (!String(tc.granularities || "").trim()) E("history.time_column", `history: у «${h.time_column}» нет granularities`);
      }
      if (!/^\d+\s*[ymd]$/.test(h.lookback.trim())) E("history.lookback", "lookback: формат N y/m/d, напр. 5y");
    }
    if (f.kind === "array_join") {
      const aliases = [];
      f.array_join.arrays.forEach((a, i) => {
        const al = a.as.trim();
        if (!a.source.trim()) E(`aj.${i}.source`, `array_join №${i + 1}: source обязателен`);
        if (!al) { E(`aj.${i}.as`, `array_join №${i + 1}: алиас as обязателен`); return; }
        if (aliases.includes(al)) E(`aj.${i}.as`, `алиас «${al}» повторяется`);
        if (colNames.includes(al)) {
          // алиас может совпадать с объявленной колонкой-развёрткой — но не более одного объявления
          const colDup = f.columns.filter((c) => c.column_name.trim() === al).length > 1;
          if (colDup) E(`aj.${i}.as`, `алиас «${al}» конфликтует с колонками`);
        }
        aliases.push(al);
      });
    }
    return errs;
  },

  /* ---------- каркас страницы ---------- */
  init() {
    const page = U.$("#page-yaml");
    page.innerHTML = "";
    const layout = U.el("div", { class: "yaml-layout" });
    YamlEditor.formRoot = U.el("div", { class: "yaml-form" });
    const preview = U.el("div", { class: "yaml-preview" });
    YamlEditor.previewEl = U.el("pre", { class: "code" });
    preview.append(
      U.el("div", { class: "yaml-preview-head" },
        U.el("span", { class: "card-title" }, "YAML-превью (read-only, генерируется из формы)"),
        U.el("button", { class: "small", onclick: () => U.copy(YamlEditor.currentYaml(), "YAML скопирован") }, "Копировать"),
        U.el("button", { class: "small", onclick: () => U.download((YamlEditor.form.logic_model || "dataset") + ".yaml", YamlEditor.currentYaml(), "application/yaml") }, "Скачать")),
      YamlEditor.previewEl);
    layout.append(YamlEditor.formRoot, preview);
    page.append(layout);
    YamlEditor.form = YamlEditor.defaultForm();
    YamlEditor.renderForm();
  },

  render() { /* содержимое уже построено; форма живёт своим состоянием */ },

  loadModel(model) {
    YamlEditor.form = YamlEditor.modelToForm(model);
    YamlEditor.renderForm();
    App.openTab("yaml");
    Toast.show(`Модель ${model.logic_model} загружена в редактор`);
  },

  currentYaml() {
    return YamlCodec.generate(YamlEditor.formToDataset(YamlEditor.form));
  },

  ref(key, fieldEl) {
    YamlEditor.fieldRefs[key] = fieldEl;
    return fieldEl;
  },

  updatePreview() {
    const f = YamlEditor.form;
    YamlEditor.previewEl.innerHTML = Hl.yaml(YamlCodec.generate(YamlEditor.formToDataset(f)));
    const errs = YamlEditor.validate(f);
    // сводка
    YamlEditor.summaryEl.innerHTML = "";
    if (errs.length) {
      YamlEditor.summaryEl.append(U.el("div", { class: "validation-summary" },
        U.el("strong", { style: "color:var(--red);font-size:12px" }, `Ошибок: ${errs.length}`),
        U.el("ul", null, ...errs.map((e) => U.el("li", null, e.msg)))));
    } else {
      YamlEditor.summaryEl.append(U.el("div", { class: "validation-ok" }, "✓ Валидация пройдена — датасет можно публиковать"));
    }
    // пометки на полях
    const errKeys = new Set(errs.map((e) => e.key));
    for (const [key, fieldEl] of Object.entries(YamlEditor.fieldRefs)) {
      if (!fieldEl.isConnected) { delete YamlEditor.fieldRefs[key]; continue; }
      fieldEl.classList.toggle("invalid", errKeys.has(key));
      const errEl = fieldEl.querySelector(".field-error");
      if (errEl) errEl.textContent = errKeys.has(key) ? (errs.find((e) => e.key === key) || {}).msg || "" : "";
    }
    YamlEditor.publishBtn.disabled = errs.length > 0;
  },

  /* ---------- мелкие фабрики полей ---------- */
  input(key, label, value, onInput, opts) {
    const inp = U.el("input", Object.assign({ type: "text", value: value ?? "" }, (opts && opts.attrs) || {}));
    if (opts && opts.mono) inp.classList.add("mono");
    inp.addEventListener("input", () => { onInput(inp.value); YamlEditor.schedule(); });
    const field = U.el("div", { class: "field" + ((opts && opts.span2) ? " span2" : "") },
      U.el("span", { class: "field-label" }, label), inp,
      (opts && opts.hint) ? U.el("span", { class: "field-hint" }, opts.hint) : null,
      U.el("span", { class: "field-error" }));
    return key ? YamlEditor.ref(key, field) : field;
  },

  schedule: null, // debounce назначается в renderForm

  /* ---------- рендер формы ---------- */
  renderForm() {
    YamlEditor.fieldRefs = {};
    YamlEditor.schedule = U.debounce(() => YamlEditor.updatePreview(), 160);
    const f = YamlEditor.form;
    const root = YamlEditor.formRoot;
    root.innerHTML = "";

    /* — панель действий — */
    YamlEditor.publishBtn = U.el("button", { class: "primary", onclick: () => YamlEditor.publish() }, "Опубликовать на стенд");
    root.append(U.el("div", { class: "actions-bar", style: "margin-bottom:14px" },
      YamlEditor.publishBtn,
      U.el("button", { onclick: () => U.download((f.logic_model || "dataset") + ".yaml", YamlEditor.currentYaml(), "application/yaml") }, "Скачать YAML"),
      U.el("button", { onclick: () => YamlEditor.importDialog() }, "Импорт YAML"),
      U.el("button", { class: "ghost", onclick: () => { YamlEditor.form = YamlEditor.defaultForm(); YamlEditor.renderForm(); } }, "Очистить")));

    YamlEditor.summaryEl = U.el("div");
    root.append(YamlEditor.summaryEl);

    /* — основные поля — */
    const groupsInput = Builder.tagInput(f.allowed_groups, () => YamlEditor.schedule(), "service_id + Enter");
    const groupsField = YamlEditor.ref("allowed_groups", U.el("div", { class: "field span2" },
      U.el("span", { class: "field-label" }, "allowed_groups (пусто — доступ всем)"), groupsInput, U.el("span", { class: "field-error" })));

    const denyInput = Builder.tagInput(f.disallowed_groups, () => YamlEditor.schedule(), "service_id + Enter");
    const denyField = YamlEditor.ref("disallowed_groups", U.el("div", { class: "field span2" },
      U.el("span", { class: "field-label" }, "disallowed_groups (запрет сильнее)"), denyInput, U.el("span", { class: "field-error" })));

    const visibleInput = Builder.tagInput(f.visible, () => YamlEditor.schedule(), "rest/sql/mcp/join_only + Enter");
    const visibleField = YamlEditor.ref("visible", U.el("div", { class: "field span2" },
      U.el("span", { class: "field-label" }, "visible (пусто — во всех каналах)"), visibleInput, U.el("span", { class: "field-error" })));

    root.append(U.el("div", { class: "form-section" },
      U.el("div", { class: "form-section-head" }, U.el("h3", null, "Основное")),
      U.el("div", { class: "form-grid" },
        YamlEditor.input("logic_model", "logic_model (имя модели для клиента)", f.logic_model, (v) => f.logic_model = v, { mono: true }),
        YamlEditor.input("table_name", "table_name (физическая таблица CH)", f.table_name, (v) => f.table_name = v, { mono: true }),
        YamlEditor.input("schema_name", "schema_name", f.schema_name, (v) => f.schema_name = v, { mono: true }),
        YamlEditor.input(null, "description", f.description, (v) => f.description = v, {}),
        groupsField, denyField, visibleField)));

    /* — переключатель типа — */
    const kindSeg = U.el("div", { class: "seg" }, ...[["plain", "обычный"], ["history", "history"], ["array_join", "array_join"]].map(([k, label]) =>
      U.el("button", {
        class: f.kind === k ? "on seg-accent" : "",
        onclick: () => { f.kind = k; YamlEditor.renderForm(); }
      }, label)));
    root.append(U.el("div", { class: "form-section" },
      U.el("div", { class: "form-section-head" }, U.el("h3", null, "Тип модели"), kindSeg,
        U.el("span", { class: "field-hint" }, "history и array_join несовместимы — переключатель выбирает одно")),
      f.kind === "history" ? YamlEditor.historySection(f) : null,
      f.kind === "array_join" ? YamlEditor.arrayJoinSection(f) : null));

    /* — колонки — */
    root.append(YamlEditor.repeatSection("Колонки", f.columns,
      () => ({ column_name: "", type: "String", description: "", sql: "", granularities: "", default_granularity: "" }),
      (c, i) => [
        YamlEditor.input(`col.${i}.column_name`, "column_name", c.column_name, (v) => c.column_name = v, { mono: true }),
        YamlEditor.input(null, "type (CH)", c.type, (v) => c.type = v, { mono: true, hint: "напр. Date, UUID, Nullable(String), Array(String)" }),
        YamlEditor.input(null, "description", c.description, (v) => c.description = v, { span2: true }),
        YamlEditor.input(null, "sql (выражение, опц.)", c.sql, (v) => c.sql = v, { mono: true, span2: true }),
        YamlEditor.input(`col.${i}.granularities`, "granularities (через запятую)", c.granularities, (v) => c.granularities = v, { mono: true, hint: GRAN.all.join(", ") }),
        YamlEditor.input(`col.${i}.default_granularity`, "default_granularity", c.default_granularity, (v) => c.default_granularity = v, { mono: true })
      ]));

    /* — виртуальные колонки — */
    root.append(YamlEditor.repeatSection("Виртуальные колонки", f.virtual_columns,
      () => ({ column_name: "", type: "String", description: "", sql: "" }),
      (c, i) => [
        YamlEditor.input(`vcol.${i}.column_name`, "column_name", c.column_name, (v) => c.column_name = v, { mono: true }),
        YamlEditor.input(null, "type (CH)", c.type, (v) => c.type = v, { mono: true }),
        YamlEditor.input(`vcol.${i}.sql`, "sql (обязательное)", c.sql, (v) => c.sql = v, { mono: true, span2: true }),
        YamlEditor.input(null, "description", c.description, (v) => c.description = v, { span2: true })
      ]));

    /* — метрики — */
    root.append(YamlEditor.repeatSection("Метрики", f.metrics,
      () => ({ metric_name: "", sql: "", verbose_name: "", description: "" }),
      (x, i) => [
        YamlEditor.input(`met.${i}.metric_name`, "metric_name", x.metric_name, (v) => x.metric_name = v, { mono: true }),
        YamlEditor.input(`met.${i}.verbose_name`, "verbose_name", x.verbose_name, (v) => x.verbose_name = v),
        YamlEditor.input(`met.${i}.sql`, "sql (обязательное)", x.sql, (v) => x.sql = v, { mono: true, span2: true, hint: "напр. uniqExact(person_id)" }),
        YamlEditor.input(null, "description", x.description, (v) => x.description = v, { span2: true })
      ]));

    if ((f.param_metrics || []).length || (f.param_virtual_columns || []).length || (f.joins || []).length) {
      root.append(U.el("div", { class: "form-section" },
        U.el("div", { class: "form-section-head" }, U.el("h3", null, "Прочее (переносится как есть)")),
        U.el("div", { class: "field-hint" },
          `параметризованных метрик: ${(f.param_metrics || []).length}, параметризованных колонок: ${(f.param_virtual_columns || []).length}, joins: ${(f.joins || []).length} — редактирование этих секций выполняется через импорт YAML`)));
    }

    YamlEditor.updatePreview();
  },

  repeatSection(title, list, makeNew, renderFields) {
    const sec = U.el("div", { class: "form-section" });
    sec.append(U.el("div", { class: "form-section-head" },
      U.el("h3", null, title),
      U.el("button", { class: "ghost small", onclick: () => { list.push(makeNew()); YamlEditor.renderForm(); } }, "+ добавить"),
      U.el("span", { class: "field-hint" }, `${list.length} шт.`)));
    list.forEach((item, i) => {
      const card = U.el("div", { class: "repeat-item" },
        U.el("button", { class: "danger-ghost small repeat-remove", title: "удалить", onclick: () => { list.splice(i, 1); YamlEditor.renderForm(); } }, "✕"),
        U.el("div", { class: "repeat-grid" }, ...renderFields(item, i)));
      sec.append(card);
    });
    if (!list.length) sec.append(U.el("div", { class: "field-hint", style: "padding:2px 2px 6px" }, "пока пусто"));
    return sec;
  },

  historySection(f) {
    const h = f.history;
    const reqToggle = U.el("input", { type: "checkbox" });
    reqToggle.checked = h.require_time_range;
    reqToggle.addEventListener("change", () => { h.require_time_range = reqToggle.checked; YamlEditor.schedule(); });
    const fillSel = U.el("select", null,
      U.el("option", { value: "previous", selected: h.fill_mode === "previous" }, "previous"),
      U.el("option", { value: "none", selected: h.fill_mode === "none" }, "none"));
    fillSel.addEventListener("change", () => { h.fill_mode = fillSel.value; YamlEditor.schedule(); });
    return U.el("div", { class: "repeat-item", style: "margin-top:8px" },
      U.el("div", { class: "repeat-grid" },
        YamlEditor.input(null, "valid_from (внутр. колонка события)", h.valid_from, (v) => h.valid_from = v, { mono: true }),
        YamlEditor.input("history.primary_key", "primary_key", h.primary_key, (v) => h.primary_key = v, { mono: true, hint: "должна существовать в columns" }),
        YamlEditor.input("history.time_column", "time_column (публичный срез)", h.time_column, (v) => h.time_column = v, { mono: true, hint: "колонка с granularities" }),
        YamlEditor.input("history.lookback", "lookback (default_lookback)", h.lookback, (v) => h.lookback = v, { mono: true, hint: "напр. 5y, 18m, 90d" }),
        U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "fill.mode"), fillSel),
        U.el("div", { class: "field" },
          U.el("label", { class: "checkline", style: "margin-top:18px" }, reqToggle, "require_time_range"))));
  },

  arrayJoinSection(f) {
    const aj = f.array_join;
    const typeSel = U.el("select", null,
      U.el("option", { value: "left", selected: aj.type === "left" }, "left"),
      U.el("option", { value: "inner", selected: aj.type === "inner" }, "inner"));
    typeSel.addEventListener("change", () => { aj.type = typeSel.value; YamlEditor.schedule(); });

    wrap.append(U.el("div", { style: "display:flex;gap:10px;align-items:center;margin-bottom:8px" },
      U.el("span", { class: "field-label" }, "type"), typeSel,
      YamlEditor.input(null, "source_model (откуда описания колонок)", aj.source_model || "",
        (v) => aj.source_model = v, { mono: true }),
      U.el("button", { class: "ghost small", onclick: () => { aj.arrays.push({ source: "", as: "", element_type: "String" }); YamlEditor.renderForm(); } }, "+ массив")));
    aj.arrays.forEach((a, i) => {

        YamlEditor.input(`aj.${i}.as`, "as (алиас)", a.as, (v) => a.as = v, { mono: true }),
