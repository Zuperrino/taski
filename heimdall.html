        U.el("button", { class: "danger-ghost small", style: "margin-top:18px", onclick: () => { aj.arrays.splice(i, 1); YamlEditor.renderForm(); } }, "✕")));
    });
    return wrap;
  },

  /* ---------- импорт YAML ---------- */
  importDialog() {
    const ta = U.el("textarea", { class: "mono", rows: 14, style: "width:100%;resize:vertical", placeholder: "datasets:\n  - logic_model: my_model\n    table_name: my_table_dm\n    ..." });
    const errEl = U.el("div", { class: "field-error" });
    Modal.open("Импорт YAML",
      U.el("div", { style: "display:flex;flex-direction:column;gap:8px" },
        U.el("span", { class: "field-hint" }, "Поддерживается подмножество YAML каталога: отступы, списки «- », инлайн-списки [a, b] и инлайн-словари { a: b }. Берётся первый датасет."),
        ta, errEl),
      U.el("div", { style: "display:flex;gap:8px" },
        U.el("button", { onclick: Modal.close }, "Отмена"),
        U.el("button", {
          class: "primary",
          onclick: () => {
            try {
              const parsed = YamlCodec.parse(ta.value);
              const ds = (parsed.datasets && parsed.datasets[0]) || (parsed.logic_model ? parsed : null);
              if (!ds) throw new Error("не найдена секция datasets");
              if (ds.history && ds.array_join) throw new Error("history и array_join несовместимы в одном датасете");
              YamlEditor.form = YamlEditor.modelToForm(ds);
              YamlEditor.renderForm();
              Modal.close();
              Toast.show("YAML импортирован в форму");
            } catch (e) {
              errEl.textContent = "Ошибка разбора: " + e.message;
            }
          }
        }, "Импортировать")),
      { wide: true });
  },

  /* ---------- публикация ---------- */
  async publish() {
    const f = YamlEditor.form;
    const errs = YamlEditor.validate(f);
    if (errs.length) { Toast.show("Исправьте ошибки валидации", "err"); return; }
    const yaml = YamlEditor.currentYaml();
    YamlEditor.publishBtn.disabled = true;
    YamlEditor.publishBtn.textContent = "Публикация…";
    try {
      const report = await Api.client().publishYaml(yaml, f.schema_name.trim() || undefined);
      YamlEditor.reportModal(report);
      document.dispatchEvent(new CustomEvent("catalog-changed"));
    } catch (e) {
      const err = e instanceof ApiError ? e : new ApiError(0, "network", ERROR_RU.network, { error: String(e) });
      Modal.open("Ошибка публикации",
        U.el("div", { class: "error-block", style: "padding:0" },
          U.el("div", { class: "error-head" },
            U.el("span", { class: "badge b-red mono" }, err.code || "error"),
            err.status ? U.el("span", { class: "badge mono" }, "HTTP " + err.status) : null),
          U.el("div", { class: "error-msg" }, ERROR_RU[err.code] || err.detail || "Неизвестная ошибка"),
          U.el("pre", { class: "code framed", html: Hl.json(JSON.stringify(err.raw || {}, null, 2)) })),
        U.el("button", { onclick: Modal.close }, "Закрыть"));
    } finally {
      YamlEditor.publishBtn.disabled = false;
      YamlEditor.publishBtn.textContent = "Опубликовать на стенд";
    }
  },

  reportModal(report) {
    const ACTION_BADGE = { created: "b-green", updated: "b-yellow", unchanged: "b-dim" };
    const ACTION_RU = { created: "создан", updated: "обновлён", unchanged: "без изменений" };
    const wrap = U.el("div", { class: "pub-report" });
    wrap.append(U.el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" },
      U.el("span", { class: "badge " + (report.status === "SUCCESS" ? "b-green" : "b-red") }, report.status),
      U.el("span", { class: "mono", style: "color:var(--muted)" }, "схема: " + (report.schema || "—")),
      U.el("span", { style: "color:var(--muted)" }, `датасетов: ${report.total_datasets}, изменений: ${report.total_changes}`)));
    for (const ds of report.datasets || []) {
      const body = U.el("div", { class: "pub-ds-body" });
      const changes = ds.changes || {};
      const SEC_RU = { columns: "колонки", virtual_columns: "вирт. колонки", param_virtual_columns: "парам. колонки", metrics: "метрики", param_metrics: "парам. метрики", model: "модель" };
      let any = false;
      for (const [sec, d] of Object.entries(changes)) {
        const parts = [];
        for (const n of d.added || []) parts.push(U.el("span", { class: "diff-added" }, "+ " + n));
        for (const n of d.removed || []) parts.push(U.el("span", { class: "diff-removed" }, "− " + n));
        for (const n of d.changed || []) parts.push(U.el("span", { class: "diff-changed" }, "~ " + n));
        if (!parts.length) continue;
        any = true;
        body.append(U.el("div", { class: "diff-line" },
          U.el("span", { class: "diff-section" }, SEC_RU[sec] || sec), ...parts));
      }
      if (!any) body.append(U.el("div", { class: "field-hint" }, "изменений нет"));
      body.append(U.el("div", { class: "routes-line" }, "→ " + (ds.routes || []).join("  ·  ")));
      const det = U.el("details", { open: ds.action !== "unchanged" },
        U.el("summary", { class: "pub-ds-head", style: "cursor:pointer;list-style:none" },
          U.el("span", { class: "mono", style: "font-weight:600" }, ds.logic_model),
          U.el("span", { class: "badge " + (ACTION_BADGE[ds.action] || "") }, ACTION_RU[ds.action] || ds.action),
          U.el("span", { class: "field-hint" }, `${ds.change_count} изм.`)),
        body);
      wrap.append(U.el("div", { class: "pub-ds" }, det));
    }
    Modal.open("Отчёт публикации", wrap,
      U.el("button", { class: "primary", onclick: Modal.close }, "Готово"), { wide: true });
  }
};

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { YamlEditor });

</script>
<script>
/* ===== src/factory-loader.js ===== */
/* ============ Подключение вкладки «Завод скиллов» ============
   Код вкладки живёт в пакете app/skill_factory/static/ и подгружается ручкой
   Завода. Здесь только загрузчик: он ставит скрипт и передаёт ему контейнер.
   Если Завод на стенде не поднята (не dev и не ift), вкладка честно говорит
   об этом и остальной интерфейс не ломается. */
"use strict";

const Skills = {
  URL: "/skill-factory/api/v1/ui/factory.js",
  _loading: null,

  /* Сообщение вместо вкладки: пока скрипт едет и когда он не доехал. */
  say(page, text) {
    page.innerHTML = "";
    page.append(U.el("div", { style: "padding:22px 14px;color:var(--muted);font-size:12.5px" }, text));
  },

  /* Неудачная попытка забывается: следующий заход на вкладку загрузит скрипт
     заново. Иначе разовый сбой стенда оставляет вкладку мёртвой до перезагрузки
     всей страницы. */
  forget(page, text) {
    Skills._loading = null;
    Skills.say(page, text);
  },

  init() {
    const page = document.getElementById("page-skills");
    if (!page || Skills._loading) return;
    Skills.say(page, "Загружаю Завод скиллов…");
    Skills._loading = new Promise((resolve) => {
      const script = document.createElement("script");
      script.src = Skills.URL;
      script.onload = () => {
        if (window.SkillFactory) { window.SkillFactory.init(page); resolve(true); return; }
        // Скрипт доехал, но вкладку не собрал: без этой ветки человек смотрит
        // на «загружаю» до перезагрузки страницы.
        Skills.forget(page, "Завод скиллов не собрался: скрипт вкладки загрузился, "
          + "но не заработал. Зайдите на вкладку ещё раз или перезагрузите страницу.");
        resolve(false);
      };
      script.onerror = () => {
        Skills.forget(page, "Завод скиллов на этом стенде не поднята: "
          + "она доступна только на dev и ift.");
        resolve(false);
      };
      document.head.append(script);
    });
  },

  render() { if (window.SkillFactory) window.SkillFactory.render(); },
};
</script>
<script>
/* ===== src/app.js ===== */
/* ============ Heimdall — каркас приложения ============ */
"use strict";

const App = {
  settings: { baseUrl: (typeof location !== "undefined" && location.origin && location.origin !== "null") ? location.origin : "http://localhost:8000", token: "" },
  catalog: [],          // полные описания моделей
  catalogError: null,
  catalogLoading: false,
  selected: null,       // "schema.logic_model"
  activeTab: "explorer",
  ui: { treeOpen: new Set(), schemaOpen: new Set(), search: "", bpWas: undefined },

  /* ---------- настройки ---------- */
  loadSettings() {
    try {
      const raw = localStorage.getItem("heimdall.settings");
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (typeof saved.baseUrl === "string") App.settings.baseUrl = saved.baseUrl;
      if (typeof saved.token === "string") App.settings.token = saved.token;
    } catch (e) { /* повреждённые настройки игнорируем */ }
  },
  saveSettings() {
    localStorage.setItem("heimdall.settings", JSON.stringify(App.settings));
    App.renderStatusbar();
  },

  /* ---------- тема (светлая/тёмная) ---------- */
  applyTheme(theme) {
    // светлая — без атрибута (работает через :root), тёмная — data-theme="dark"
    if (theme === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
    const btn = U.$("#themeToggle");
    if (btn) btn.textContent = theme === "dark" ? "◑" : "◐";
  },
  currentTheme() {
    return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  },
  initTheme() {
    let theme = localStorage.getItem("heimdall.theme");
    if (theme !== "light" && theme !== "dark") {
      theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    App.applyTheme(theme);
  },
  toggleTheme() {
    const next = App.currentTheme() === "dark" ? "light" : "dark";
    localStorage.setItem("heimdall.theme", next);
    App.applyTheme(next);
  },

  selectedModel() {
    if (!App.selected) return null;
    return App.catalog.find((m) => ModelInfo.key(m) === App.selected) || null;
  },

  /* ---------- загрузка каталога ---------- */
  async loadCatalog() {
    App.catalogLoading = true; App.catalogError = null;
    App.renderTree();
    try {
      const client = Api.client();
      const list = await client.listTables();
      const settled = await Promise.allSettled(
        list.map((t) => client.getTable(t.schema_name, t.logic_model)));
      // недоступные модели пропускаем
      App.catalog = settled.filter((s) => s.status === "fulfilled").map((s) => s.value);
      App.catalogLoading = false;
      if (App.selected && !App.selectedModel()) App.selected = null;
    } catch (e) {
      App.catalogLoading = false;
      App.catalogError = e instanceof ApiError ? e : new ApiError(0, "network", ERROR_RU.network);
    }
    App.renderTree();
    App.renderStatusbar();
    App.renderActivePage();
    if (window.SqlConsole) SqlConsole.renderSide();
  },

  /* ---------- навигация ---------- */
  openTab(name) {
    App.activeTab = name;
    U.$$(".ws-tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
    U.$$(".ws-page").forEach((p) => p.classList.toggle("active", p.dataset.page === name));
    localStorage.setItem("heimdall.tab", name);
    App.fitPanels(name);
    App.renderActivePage();
  },

  /* Нижняя панель показывает результат запроса и сырой SQL — Заводу скиллов она
     не нужна вовсе, а место занимает. Уходя со вкладки, возвращаем как было:
     панель могла быть открыта не просто так. */
  fitPanels(name) {
    const panel = U.$("#bottomPanel");
    if (!panel) return;
    if (name === "skills") {
      if (App.ui.bpWas === undefined) App.ui.bpWas = panel.classList.contains("collapsed");
      panel.classList.add("collapsed");
      return;
    }
    if (App.ui.bpWas !== undefined) {
      panel.classList.toggle("collapsed", App.ui.bpWas);
      App.ui.bpWas = undefined;
    }
  },

  selectModel(key, tab) {
    App.selected = key;
    localStorage.setItem("heimdall.selected", key);
    App.ui.treeOpen.add(key);
    App.renderTree();
    App.renderStatusbar();
    if (tab) App.openTab(tab); else App.renderActivePage();
  },

  renderActivePage() {
    const m = App.selectedModel();
    if (App.activeTab === "explorer" && window.Explorer) Explorer.render(m);
    if (App.activeTab === "builder" && window.Builder) Builder.render(m);
    if (App.activeTab === "sql" && window.SqlConsole) SqlConsole.render();
    if (App.activeTab === "yaml" && window.YamlEditor) YamlEditor.render();
    if (App.activeTab === "skills" && window.Skills) Skills.render();
  },

  /* ---------- дерево каталога ---------- */
  renderTree() {
    const root = U.$("#treeRoot");
    root.innerHTML = "";
    if (App.catalogLoading) {
      root.append(U.el("div", { class: "skeleton-rows" },
        ...[90, 70, 80, 60, 75, 85].map((w) => { const d = U.el("div", { class: "sk-line" }); d.style.width = w + "%"; return d; })));
      return;
    }
    if (App.catalogError) {
      root.append(U.el("div", { class: "tree-empty" },
        U.el("div", null, "Каталог недоступен"),
        U.el("div", { class: "mono", style: "color:var(--red);font-size:11px;margin:6px 0;" }, App.catalogError.detail || App.catalogError.code),
        U.el("button", { class: "small", onclick: () => App.loadCatalog() }, "Повторить")));
      return;
    }
    const q = App.ui.search.trim().toLowerCase();
    const match = (m) => {
      if (!q) return true;
      const hay = [
        m.logic_model, m.description, m.table_name,
        ...ModelInfo.allColumns(m).flatMap((c) => [c.column_name, c.description]),
        ...ModelInfo.allMetrics(m).flatMap((x) => [x.metric_name, x.verbose_name])
      ].join(" ").toLowerCase();
      return hay.includes(q);
    };
    const schemas = [...new Set(App.catalog.map((m) => m.schema_name))];
    let shown = 0;
    for (const schema of schemas) {
      const models = App.catalog.filter((m) => m.schema_name === schema && match(m));
      if (!models.length) continue;
      const open = q ? true : !App.ui.schemaOpen.has("closed:" + schema);
      const caret = U.el("span", { class: "tree-caret" + (open ? " open" : "") }, "▶");
      const label = U.el("div", {
        class: "tree-schema-label",
        onclick: () => {
          const k = "closed:" + schema;
          App.ui.schemaOpen.has(k) ? App.ui.schemaOpen.delete(k) : App.ui.schemaOpen.add(k);
          App.renderTree();
        }
      }, caret, schema, U.el("span", { style: "color:var(--faint)" }, String(models.length)));
      root.append(label);
      if (!open) continue;
      for (const m of models) { root.append(App.renderTreeModel(m, q)); shown++; }
    }
    if (!shown && q) root.append(U.el("div", { class: "tree-empty" }, "Ничего не найдено"));
  },

  renderTreeModel(m, q) {
    const key = ModelInfo.key(m);
    const open = q ? false : App.ui.treeOpen.has(key);
    const wrap = U.el("div", { class: "tree-model" + (App.selected === key ? " selected" : "") });
    const caret = U.el("span", {
      class: "tree-caret" + (open ? " open" : ""),
      onclick: (e) => {
        e.stopPropagation();
        open ? App.ui.treeOpen.delete(key) : App.ui.treeOpen.add(key);
        App.renderTree();
      }
    }, "▶");
    const badges = ModelInfo.kindBadges(m)
      .filter((b) => b[0] !== "обычный")
      .map(([name, icon, cls]) => U.el("span", { class: `badge ${cls}`, title: name, style: "padding:0 5px" }, icon));
    const queryBtn = U.el("button", {
      class: "ghost small", title: "Открыть в конструкторе запросов",
      style: "padding:0 5px;font-size:11px;",
      onclick: (e) => { e.stopPropagation(); App.selectModel(key, "builder"); }
    }, "▶");
    const row = U.el("div", { class: "tree-model-row", onclick: () => App.selectModel(key, "explorer") },
      caret,
      U.el("span", { class: "tree-model-name", title: m.description || "" }, m.logic_model),
      ...badges,
      U.el("span", { style: "flex:1" }),
      queryBtn);
    wrap.append(row);
    if (open) {
      const kids = U.el("div", { class: "tree-children" });
      kids.append(U.el("div", { class: "tree-section-label" }, "колонки"));
      for (const c of ModelInfo.allColumns(m)) {
        const marks = [];
        if (c._kind === "virtual") marks.push(U.el("span", { class: "minibadge m-virtual", title: "виртуальная: " + (c.sql || "") }, "ƒ"));
        if (Array.isArray(c.granularities) && c.granularities.length) marks.push(U.el("span", { class: "minibadge m-time", title: "временное измерение" }, "⏱"));
        if (c._kind === "param") marks.push(U.el("span", { class: "minibadge m-param", title: "параметризована — не реализовано в REST" }, "⚙"));
        kids.append(U.el("div", { class: "tree-leaf" + (c._kind === "param" ? " param" : ""), title: c.description || "" },
          U.el("span", { html: CHTypes.icon(c.type) }),
          U.el("span", { class: "leaf-name" }, c.column_name),
          ...marks,
          U.el("span", { class: "leaf-extra" }, c.type)));
      }
      const mets = ModelInfo.allMetrics(m);
      if (mets.length) kids.append(U.el("div", { class: "tree-section-label" }, "метрики"));
      for (const x of mets) {
        const marks = x._kind === "param"
          ? [U.el("span", { class: "minibadge m-param", title: "параметризована — не реализовано в REST" }, "⚙")] : [];
        kids.append(U.el("div", { class: "tree-leaf" + (x._kind === "param" ? " param" : ""), title: x.description || x.verbose_name || "" },
          U.el("span", { html: '<span class="ticon t-metric">Σ</span>' }),
          U.el("span", { class: "leaf-name" }, x.metric_name),
          ...marks,
          U.el("span", { class: "leaf-extra" }, x.verbose_name || "")));
      }
      wrap.append(kids);
    }
    return wrap;
  },

  /* ---------- статус-бар ---------- */
  ping: { state: "wait", latency: null },
  async doPing() {
    App.ping = { state: "wait", latency: null };
    App.renderStatusbar();
    try {
      const r = await Api.client().ping();
      App.ping = { state: "ok", latency: r.latency };
    } catch (e) {
      App.ping = { state: "bad", latency: null };
    }
    App.renderStatusbar();
    return App.ping;
  },

  renderStatusbar() {
    const sb = U.$("#statusbar");
    const s = App.settings;
    sb.innerHTML = "";
    const modeBadge = U.el("span", { class: "badge b-green" }, "LIVE");
    const pingTitle = { ok: `сервер доступен${App.ping.latency ? `, ${App.ping.latency} мс` : ""}`, bad: "сервер недоступен", wait: "проверка…" }[App.ping.state];
    sb.append(
      U.el("span", { class: "sb-item", style: "cursor:pointer", onclick: () => SettingsModal.open() }, modeBadge),
      U.el("span", { class: "sb-item mono", style: "cursor:pointer", onclick: () => SettingsModal.open(), title: "Настройки подключения" },
        s.baseUrl || "base URL не задан"),
      U.el("span", { class: "sb-item", title: pingTitle },
        U.el("span", { class: `sb-dot ${App.ping.state}` }),
        App.ping.state === "ok" ? `ping ${App.ping.latency ?? "—"} мс` : App.ping.state === "bad" ? "нет связи" : "ping…"),
      U.el("span", { class: "sb-spacer" }),
      App.selected ? U.el("span", { class: "sb-item mono" }, "модель: " + App.selected) : null,
      U.el("span", { class: "sb-item" }, `${App.catalog.length} моделей`)
    );
  },

  /* ---------- ресайзеры и сворачивание ---------- */
  initResizers() {
    const sidebar = U.$("#sidebar");
    const vr = U.$("#vResizer");
    vr.addEventListener("mousedown", (e) => {
      e.preventDefault();
      vr.classList.add("dragging");
      const startX = e.clientX, startW = sidebar.getBoundingClientRect().width;
      const move = (ev) => {
        const w = U.clamp(startW + ev.clientX - startX, 180, 520);
        document.documentElement.style.setProperty("--sidebar-w", w + "px");
      };
      const up = () => {
        vr.classList.remove("dragging");
        window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
        /* Размер запоминаем: раскладку под свой монитор человек подгонял в
           каждой сессии заново, хотя свёрнутое состояние уже переживало
           перезагрузку. */
        App.rememberSize("sidebar", document.documentElement.style.getPropertyValue("--sidebar-w"));
      };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });

    const bp = U.$("#bottomPanel");
    const hr = U.$("#hResizer");
    hr.addEventListener("mousedown", (e) => {
      e.preventDefault();
      if (bp.classList.contains("collapsed")) return;
      hr.classList.add("dragging");
      const startY = e.clientY, startH = bp.getBoundingClientRect().height;
      const move = (ev) => {
        const h = U.clamp(startH - (ev.clientY - startY), 100, window.innerHeight - 220);
        document.documentElement.style.setProperty("--bottom-h", h + "px");
      };
      const up = () => {
        hr.classList.remove("dragging");
        window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
        App.rememberSize("bottom", document.documentElement.style.getPropertyValue("--bottom-h"));
      };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
    App.restoreSizes();
  },

  /* Размеры панелей живут в одном ключе: их два, и заводить по ключу на каждую
     значит потом искать их по всему хранилищу. */
  rememberSize(name, value) {
    if (!value) return;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("heimdall.sizes") || "{}"); } catch (e) { saved = {}; }
    saved[name] = value;
    try { localStorage.setItem("heimdall.sizes", JSON.stringify(saved)); } catch (e) { /* приватный режим */ }
  },

  restoreSizes() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("heimdall.sizes") || "{}"); } catch (e) { return; }
    const root = document.documentElement.style;
    if (saved.sidebar) root.setProperty("--sidebar-w", saved.sidebar);
    if (saved.bottom) root.setProperty("--bottom-h", saved.bottom);
  },

  /* ---------- запуск ---------- */
  async boot() {
    App.loadSettings();
    App.initTheme();
    Tip.init();
    App.initResizers();

    U.$("#sidebarToggle").addEventListener("click", () => {
      const hidden = U.$("#sidebar").classList.toggle("collapsed");
      localStorage.setItem("heimdall.sidebar", hidden ? "collapsed" : "open");
    });
    if (localStorage.getItem("heimdall.sidebar") === "collapsed") {
      U.$("#sidebar").classList.add("collapsed");
    }
    U.$("#themeToggle").addEventListener("click", () => App.toggleTheme());
    U.$("#settingsBtn").addEventListener("click", () => SettingsModal.open());
    U.$("#treeSearch").addEventListener("input", U.debounce((e) => {
      App.ui.search = e.target.value;
      App.renderTree();
    }, 120));
    U.$$(".ws-tab").forEach((t) => t.addEventListener("click", () => App.openTab(t.dataset.tab)));

    document.addEventListener("catalog-changed", () => App.loadCatalog());

    Bp.init();
    SqlConsole.init();
    YamlEditor.init();
    Skills.init();

    const savedTab = localStorage.getItem("heimdall.tab");
    const savedSel = localStorage.getItem("heimdall.selected");
    if (savedSel) App.selected = savedSel;

    App.renderStatusbar();
    await App.loadCatalog();
    App.doPing();
    App.openTab(savedTab && ["explorer", "builder", "sql", "yaml", "skills"].includes(savedTab) ? savedTab : "explorer");
  }
};

/* ============ Модалки ============ */
const Modal = {
  open(title, bodyEl, footEl, opts) {
    Modal.close();
    const backdrop = U.el("div", { class: "modal-backdrop", onclick: (e) => { if (e.target === backdrop) Modal.close(); } });
    const modal = U.el("div", { class: "modal" + (opts && opts.wide ? " wide" : "") },
      U.el("div", { class: "modal-head" }, U.el("h2", null, title),
        U.el("button", { class: "ghost iconbtn", onclick: Modal.close }, "✕")),
      U.el("div", { class: "modal-body" }, bodyEl),
      footEl ? U.el("div", { class: "modal-foot" }, footEl) : null);
    backdrop.append(modal);
    U.$("#modalRoot").append(backdrop);
  },
  close() { U.$("#modalRoot").innerHTML = ""; }
};

/* ============ Настройки ============ */
const SettingsModal = {
  open() {
    const s = App.settings;
    const urlInput = U.el("input", { type: "text", class: "mono", value: s.baseUrl, placeholder: "http://localhost:8000" });
    const tokenInput = U.el("input", { type: "password", class: "mono", value: s.token, placeholder: "JWT-токен", autocomplete: "off" });
    const eyeBtn = U.el("button", { class: "small", onclick: () => { tokenInput.type = tokenInput.type === "password" ? "text" : "password"; } }, "👁");
    const pingResult = U.el("span", { class: "field-hint" }, "");

    const checkBtn = U.el("button", {
      onclick: async () => {
        pingResult.textContent = "проверка…"; pingResult.style.color = "var(--yellow)";
        const tmp = new HttpApiClient(urlInput.value, tokenInput.value);
        try {
          const r = await tmp.ping();
          pingResult.textContent = `✓ доступен, ${r.latency} мс`; pingResult.style.color = "var(--green)";
        } catch (e) {
          pingResult.textContent = `✗ ${e.detail || e.code || "недоступен"}`; pingResult.style.color = "var(--red)";
        }
      }
    }, "Проверить соединение");

    const body = U.el("div", { style: "display:flex;flex-direction:column;gap:12px" },
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "Base URL сервиса"), urlInput,
        U.el("span", { class: "field-hint" }, "Адрес сервиса; он же подставляется при копировании curl")),
      U.el("div", { class: "field" }, U.el("span", { class: "field-label" }, "JWT-токен"),
        U.el("div", { style: "display:flex;gap:6px" }, tokenInput, eyeBtn),
        U.el("span", { class: "field-hint" }, "Передаётся заголовком Authorization: Bearer …")),
      U.el("div", { style: "display:flex;align-items:center;gap:10px" }, checkBtn, pingResult));

    const foot = U.el("div", { style: "display:flex;gap:8px" },
      U.el("button", { onclick: Modal.close }, "Отмена"),
      U.el("button", {
        class: "primary",
        onclick: () => {
          const reload = App.settings.baseUrl !== urlInput.value.trim() || App.settings.token !== tokenInput.value;
          App.settings.baseUrl = urlInput.value.trim();
          App.settings.token = tokenInput.value;
          App.saveSettings();
          Modal.close();
          Toast.show("Настройки сохранены");
          App.doPing();
          if (reload) App.loadCatalog();
        }
      }, "Сохранить"));

    Modal.open("Настройки подключения", body, foot);
  }
};

window.addEventListener("DOMContentLoaded", () => App.boot());

/* экспорт в window (top-level const не попадает в window) */
Object.assign(window, { App, Modal, SettingsModal });

</script>
</body>
</html>
